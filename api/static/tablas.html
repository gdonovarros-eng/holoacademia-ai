<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tablas de Rastreo · Holoacadem-iA</title>
<style>
:root{
  --bg:#0e0e12;--surface:#16161e;--card:#1e1e2a;--border:#2a2a3a;
  --accent:#7c6df0;--accent2:#5b8fff;--green:#4caf7d;--red:#e05c5c;
  --yellow:#f0c060;--orange:#f07c40;
  --text:#e8e8f0;--muted:#7a7a9a;--tag-bg:#252535;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
.app-header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.app-header a{color:var(--muted);text-decoration:none;font-size:1.2rem;padding:4px 8px;border-radius:6px;transition:color .2s}
.app-header a:hover{color:var(--text)}
.app-header h1{font-size:1rem;font-weight:600;letter-spacing:.03em}
.app-header span{color:var(--muted);font-size:.8rem}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.stat-pill{background:var(--tag-bg);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:.75rem;color:var(--muted)}
.stat-pill b{color:var(--text)}

/* LAYOUT */
.main-layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 55px)}
.sidebar{width:220px;min-width:180px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow-y:auto}
.content-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.confirmed-panel{width:300px;min-width:240px;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column}

/* SIDEBAR */
.sidebar-section{padding:10px 0}
.sidebar-label{font-size:.65rem;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:4px 14px 8px}
.cat-btn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 14px;background:none;border:none;color:var(--muted);font-size:.8rem;cursor:pointer;text-align:left;transition:all .15s;border-left:2px solid transparent}
.cat-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}
.cat-btn.active{color:var(--accent);background:rgba(124,109,240,.08);border-left-color:var(--accent)}
.cat-count{margin-left:auto;background:var(--tag-bg);border-radius:10px;padding:1px 7px;font-size:.68rem;color:var(--muted)}
.cat-btn.active .cat-count{color:var(--accent)}

.tipo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-bacteria{background:#e05c5c}
.dot-virus{background:#f07c40}
.dot-hongo{background:#f0c060}
.dot-parasito{background:#4caf7d}
.dot-emocional{background:#7c6df0}
.dot-disfuncional{background:#5b8fff}
.dot-especial{background:#ff85b3}
.dot-reservorio{background:#7ae0c0}
.dot-desconocido{background:#7a7a9a}
.dot-sales{background:#e0c87a}
.dot-bach{background:#9de08a}
.dot-vitaminas{background:#8ad4e0}
.dot-creencias{background:#d08ae0}
.dot-conflicto{background:#ff9f6b}
.dot-homeopatico{background:#c0e0ff}
.dot-chakra{background:#ffb3e6}
.dot-elementos{background:#b3ffb3}
.dot-aminoacidos{background:#ffd9b3}
.dot-enzimas{background:#b3d9ff}
.dot-miedos{background:#e0b3ff}

/* SISTEMA FILTER */
.sis-filter{padding:10px 14px}
.sis-filter label{font-size:.7rem;color:var(--muted);display:block;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sis-filter select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:.78rem}
.sis-filter select:focus{outline:none;border-color:var(--accent)}

/* SEARCH */
.search-bar{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.search-bar input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
.search-bar input:focus{outline:none;border-color:var(--accent)}

/* TABLE AREA */
.table-scroll{flex:1;overflow-y:auto;padding:12px 16px}
.table-scroll::-webkit-scrollbar{width:4px}
.table-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.category-title{font-size:1rem;font-weight:700;margin-bottom:4px;color:var(--text)}
.category-sub{font-size:.75rem;color:var(--muted);margin-bottom:12px}

.items-grid{display:flex;flex-direction:column;gap:6px}
.item-row{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:all .15s}
.item-row:hover{border-color:var(--accent);background:rgba(124,109,240,.06)}
.item-row.checked{border-color:var(--green);background:rgba(76,175,125,.08)}
.item-cb{width:16px;height:16px;accent-color:var(--green);cursor:pointer;margin-top:2px;flex-shrink:0}
.item-body{flex:1;min-width:0}
.item-nombre{font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:3px}
.item-condiciones{font-size:.75rem;color:var(--muted);line-height:1.45;margin-bottom:3px}
.item-emocional{font-size:.72rem;color:#b8a8f0;font-style:italic;line-height:1.4}
.item-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:.62rem;padding:2px 7px;border-radius:10px;background:var(--tag-bg);color:var(--muted)}
.tag-tipo{text-transform:capitalize}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state svg{opacity:.3;margin-bottom:12px}
.empty-state p{font-size:.85rem}

/* CONFIRMED PANEL */
.confirmed-panel .panel-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.confirmed-panel .panel-header h3{font-size:.85rem;font-weight:700;color:var(--text)}
.conf-count{background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;font-size:.72rem;font-weight:700}
.confirmed-scroll{flex:1;overflow-y:auto;padding:10px}
.confirmed-scroll::-webkit-scrollbar{width:4px}
.confirmed-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.conf-item{background:var(--card);border:1px solid var(--green);border-radius:7px;padding:8px 10px;margin-bottom:6px;display:flex;gap:8px;align-items:flex-start}
.conf-item-body{flex:1;min-width:0}
.conf-nombre{font-size:.78rem;font-weight:600;margin-bottom:2px}
.conf-sub{font-size:.68rem;color:var(--muted);line-height:1.4}
.conf-remove{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:4px;font-size:.75rem;flex-shrink:0;transition:color .15s}
.conf-remove:hover{color:var(--red)}
.conf-empty{text-align:center;padding:40px 14px;color:var(--muted);font-size:.78rem;line-height:1.6}

.panel-actions{padding:10px 12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.btn-copy{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px;font-size:.8rem;font-weight:600;cursor:pointer;width:100%;transition:opacity .15s}
.btn-copy:hover{opacity:.85}
.btn-clear{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px;font-size:.75rem;cursor:pointer;width:100%;transition:all .15s}
.btn-clear:hover{border-color:var(--red);color:var(--red)}

/* LOADING */
.loading{text-align:center;padding:60px;color:var(--muted);font-size:.85rem}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Static table styles (Schüssler, Bach, Vitaminas, Creencias) */
.static-table{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:8px}
.static-table th{background:var(--tag-bg);color:var(--muted);font-weight:600;padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
.static-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top;line-height:1.4}
.static-table tr:hover td{background:rgba(255,255,255,.03)}
.static-table tr.checked-row td{background:rgba(76,175,125,.07)}
.num-cell{color:var(--muted);width:36px;font-size:.7rem}
.nombre-cell{font-weight:600;color:var(--text);min-width:140px}
.desc-cell{color:var(--muted)}
.emoc-cell{color:#b8a8f0;font-style:italic}
.cb-cell{width:32px;text-align:center}
.cb-cell input[type=checkbox]{accent-color:var(--green);width:14px;height:14px;cursor:pointer}

/* Group headers inside static tables */
.group-header{background:rgba(124,109,240,.1);color:var(--accent);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px}

@media(max-width:900px){
  .confirmed-panel{display:none}
}
@media(max-width:640px){
  .sidebar{width:160px}
}
</style>
</head>
<body>

<header class="app-header">
  <a href="/" title="Inicio">&#8592;</a>
  <h1>📋 Rastreo de Tablas</h1>
  <span id="categoryLabel">Cargando…</span>
  <div class="header-right">
    <div class="stat-pill">Total seleccionados: <b id="totalConf">0</b></div>
  </div>
</header>

<div class="main-layout">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Pares Biomagnéticos</div>
      <button class="cat-btn active" data-cat="bacteria" onclick="selectCat(this)">
        <span class="tipo-dot dot-bacteria"></span>Bacterias<span class="cat-count" id="cnt-bacteria">0</span>
      </button>
      <button class="cat-btn" data-cat="virus" onclick="selectCat(this)">
        <span class="tipo-dot dot-virus"></span>Virus<span class="cat-count" id="cnt-virus">0</span>
      </button>
      <button class="cat-btn" data-cat="hongo" onclick="selectCat(this)">
        <span class="tipo-dot dot-hongo"></span>Hongos<span class="cat-count" id="cnt-hongo">0</span>
      </button>
      <button class="cat-btn" data-cat="parasito" onclick="selectCat(this)">
        <span class="tipo-dot dot-parasito"></span>Parásitos<span class="cat-count" id="cnt-parasito">0</span>
      </button>
      <button class="cat-btn" data-cat="emocional" onclick="selectCat(this)">
        <span class="tipo-dot dot-emocional"></span>Emocionales<span class="cat-count" id="cnt-emocional">0</span>
      </button>
      <button class="cat-btn" data-cat="disfuncional" onclick="selectCat(this)">
        <span class="tipo-dot dot-disfuncional"></span>Disfuncionales<span class="cat-count" id="cnt-disfuncional">0</span>
      </button>
      <button class="cat-btn" data-cat="especial" onclick="selectCat(this)">
        <span class="tipo-dot dot-especial"></span>Especiales<span class="cat-count" id="cnt-especial">0</span>
      </button>
      <button class="cat-btn" data-cat="reservorio" onclick="selectCat(this)">
        <span class="tipo-dot dot-reservorio"></span>Reservorios<span class="cat-count" id="cnt-reservorio">0</span>
      </button>
      <button class="cat-btn" data-cat="desconocido" onclick="selectCat(this)">
        <span class="tipo-dot dot-desconocido"></span>Desconocidos<span class="cat-count" id="cnt-desconocido">0</span>
      </button>
    </div>

    <div class="sis-filter">
      <label>Filtrar por sistema</label>
      <select id="sisFilter" onchange="applyFilters()">
        <option value="">Todos los sistemas</option>
        <option value="cardiovascular">Cardiovascular</option>
        <option value="digestivo">Digestivo</option>
        <option value="endócrino">Endócrino</option>
        <option value="genital">Genital</option>
        <option value="linfático">Linfático</option>
        <option value="neurológico">Neurológico</option>
        <option value="osteomuscular">Osteomuscular</option>
        <option value="piel">Piel</option>
        <option value="renal_urinario">Renal / Urinario</option>
        <option value="respiratorio">Respiratorio</option>
      </select>
    </div>

    <div class="sidebar-section" style="border-top:1px solid var(--border)">
      <div class="sidebar-label">Conflictología Psicosomática</div>
      <button class="cat-btn" data-cat="conflicto_respiratorio" onclick="selectCat(this)">
        <span class="tipo-dot dot-conflicto"></span>Respiratorio<span class="cat-count" id="cnt-conf-respiratorio">0</span>
      </button>
      <button class="cat-btn" data-cat="conflicto_digestivo" onclick="selectCat(this)">
        <span class="tipo-dot dot-conflicto"></span>Digestivo<span class="cat-count" id="cnt-conf-digestivo">0</span>
      </button>
      <button class="cat-btn" data-cat="conflicto_cardiovascular" onclick="selectCat(this)">
        <span class="tipo-dot dot-conflicto"></span>Cardiovascular<span class="cat-count" id="cnt-conf-cardiovascular">0</span>
      </button>
      <button class="cat-btn" data-cat="conflicto_locomotor" onclick="selectCat(this)">
        <span class="tipo-dot dot-conflicto"></span>Locomotor/Óseo<span class="cat-count" id="cnt-conf-locomotor">0</span>
      </button>
      <button class="cat-btn" data-cat="conflicto_genital" onclick="selectCat(this)">
        <span class="tipo-dot dot-conflicto"></span>Reproductor<span class="cat-count" id="cnt-conf-genital">0</span>
      </button>
      <button class="cat-btn" data-cat="conflicto_urinario" onclick="selectCat(this)">
        <span class="tipo-dot dot-conflicto"></span>Urinario/Renal<span class="cat-count" id="cnt-conf-urinario">0</span>
      </button>
      <button class="cat-btn" data-cat="conflicto_endocrino" onclick="selectCat(this)">
        <span class="tipo-dot dot-conflicto"></span>Endócrino<span class="cat-count" id="cnt-conf-endocrino">0</span>
      </button>
      <button class="cat-btn" data-cat="conflicto_inmunologico" onclick="selectCat(this)">
        <span class="tipo-dot dot-conflicto"></span>Inmunológico<span class="cat-count" id="cnt-conf-inmunologico">0</span>
      </button>
      <button class="cat-btn" data-cat="conflicto_piel" onclick="selectCat(this)">
        <span class="tipo-dot dot-conflicto"></span>Piel/Lipofascial<span class="cat-count" id="cnt-conf-piel">0</span>
      </button>
      <button class="cat-btn" data-cat="conflicto_neurosensorial" onclick="selectCat(this)">
        <span class="tipo-dot dot-conflicto"></span>Neurosensorial<span class="cat-count" id="cnt-conf-neurosensorial">0</span>
      </button>
    </div>

    <div class="sidebar-section" style="border-top:1px solid var(--border)">
      <div class="sidebar-label">Otros Rastreos</div>
      <button class="cat-btn" data-cat="sales" onclick="selectCat(this)">
        <span class="tipo-dot dot-sales"></span>Sales de Schüssler<span class="cat-count">12</span>
      </button>
      <button class="cat-btn" data-cat="bach" onclick="selectCat(this)">
        <span class="tipo-dot dot-bach"></span>Florales de Bach<span class="cat-count">38</span>
      </button>
      <button class="cat-btn" data-cat="vitaminas" onclick="selectCat(this)">
        <span class="tipo-dot dot-vitaminas"></span>Vitaminas / Minerales<span class="cat-count">26</span>
      </button>
      <button class="cat-btn" data-cat="creencias" onclick="selectCat(this)">
        <span class="tipo-dot dot-creencias"></span>Creencias Limitantes<span class="cat-count">40</span>
      </button>
      <button class="cat-btn" data-cat="miedos" onclick="selectCat(this)">
        <span class="tipo-dot dot-miedos"></span>Miedos / Fobias<span class="cat-count">35</span>
      </button>
    </div>

    <div class="sidebar-section" style="border-top:1px solid var(--border)">
      <div class="sidebar-label">Homeopatía</div>
      <button class="cat-btn" data-cat="policrestos" onclick="selectCat(this)">
        <span class="tipo-dot dot-homeopatico"></span>Policrestos<span class="cat-count">25</span>
      </button>
      <button class="cat-btn" data-cat="semipolicrestos" onclick="selectCat(this)">
        <span class="tipo-dot dot-homeopatico"></span>Semipolicrestos<span class="cat-count">30</span>
      </button>
    </div>

    <div class="sidebar-section" style="border-top:1px solid var(--border)">
      <div class="sidebar-label">Centros Energéticos</div>
      <button class="cat-btn" data-cat="chakras_primarios" onclick="selectCat(this)">
        <span class="tipo-dot dot-chakra"></span>Chakras Primarios<span class="cat-count">7</span>
      </button>
      <button class="cat-btn" data-cat="chakras_secundarios" onclick="selectCat(this)">
        <span class="tipo-dot dot-chakra"></span>Chakras Secundarios<span class="cat-count">21</span>
      </button>
      <button class="cat-btn" data-cat="cinco_elementos" onclick="selectCat(this)">
        <span class="tipo-dot dot-elementos"></span>5 Elementos MTC<span class="cat-count">5</span>
      </button>
    </div>

    <div class="sidebar-section" style="border-top:1px solid var(--border)">
      <div class="sidebar-label">Bioquímica</div>
      <button class="cat-btn" data-cat="aminoacidos" onclick="selectCat(this)">
        <span class="tipo-dot dot-aminoacidos"></span>Aminoácidos<span class="cat-count">20</span>
      </button>
      <button class="cat-btn" data-cat="enzimas" onclick="selectCat(this)">
        <span class="tipo-dot dot-enzimas"></span>Enzimas<span class="cat-count">18</span>
      </button>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="content-area">
    <div class="search-bar">
      <input type="search" id="searchBox" placeholder="🔍 Buscar por nombre, condición, emoción…" oninput="applyFilters()"/>
    </div>
    <div class="table-scroll" id="tableScroll">
      <div class="loading"><div class="spinner"></div><br>Cargando base de datos…</div>
    </div>
  </div>

  <!-- CONFIRMED PANEL -->
  <div class="confirmed-panel">
    <div class="panel-header">
      <h3>✅ Rastreo confirmado</h3>
      <span class="conf-count" id="confCount">0</span>
    </div>
    <div class="confirmed-scroll" id="confirmedScroll">
      <div class="conf-empty">Marca ítems en la tabla para agregarlos aquí.</div>
    </div>
    <div class="panel-actions">
      <button class="btn-copy" onclick="copiarConfirmados()">📋 Copiar lista</button>
      <button class="btn-clear" onclick="limpiarTodo()">🗑 Limpiar todo</button>
    </div>
  </div>

</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let ALL_PAIRS = [];           // raw pairs from API
let CONFLICTO_DB = {};        // conflictología db from API
let currentCat = 'bacteria';  // selected category
let confirmed = [];            // {id, nombre, tipo, cat, sub}

// ─── Static datasets ─────────────────────────────────────────────────────────
const SALES_SCHUSSLER = [
  {n:1, nombre:'Calcarea Fluorica (Calc Fluor)', desc:'Tejido elástico, dientes, huesos, várices, hemorroides', emoc:'Inseguridad, falta de firmeza interior'},

  {n:7, nombre:'Kali Sulphuricum (Kali Sulph)', desc:'Piel, mucosas, tercer estadio inflamatorio, secreciones amarillas', emoc:'Miedo al cambio, inflexibilidad'},

  {n:9, nombre:'Natrum Muriaticum (Nat Mur)', desc:'Equilibrio hídrico, sequedad/exceso de líquidos, migrañas', emoc:'Duelo reprimido, sensibilidad emocional'},
  {n:10,nombre:'Natrum Phosphoricum (Nat Phos)', desc:'Acidez, metabolismo ácido-base, reumatismo, gota', emoc:'Conflictos no resueltos, amargura'},
  {n:11,nombre:'Natrum Sulphuricum (Nat Sulph)', desc:'Hígado, desintoxicación, asma húmeda, vesícula', emoc:'Tristeza profunda, ganas de morir'},
  {n:12,nombre:'Silicea (Silica)', desc:'Tejido conectivo, piel, cabello, uñas, abscesos', emoc:'Falta de confianza, timidez extrema'},
];

const BACH_FLOWERS = [
  // Grupo 1 — Miedo
  {g:'MIEDO', n:1, nombre:'Rock Rose (Helianthemum)', desc:'Terror, pánico, pesadillas, urgencias extremas', emoc:'Miedo paralizante'},
  {g:'MIEDO', n:2, nombre:'Mimulus (Mimulus guttatus)', desc:'Miedos conocidos y cotidianos: altura, animales, enfermedad', emoc:'Timidez, miedo específico'},
  {g:'MIEDO', n:3, nombre:'Cherry Plum (Prunus cerasifera)', desc:'Miedo a perder el control, impulsos violentos, colapso mental', emoc:'Desesperación extrema'},
  {g:'MIEDO', n:4, nombre:'Aspen (Populus tremula)', desc:'Miedos vagos, aprensión sin causa, terrores nocturnos', emoc:'Ansiedad difusa, presagios'},
  {g:'MIEDO', n:5, nombre:'Red Chestnut (Aesculus carnea)', desc:'Miedo excesivo por seres queridos, catastrofismo', emoc:'Sobreprotección, worry'},

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  // Load pairs DB
  try {
    const r = await fetch('/api/pares-db');
    const d = await r.json();
    ALL_PAIRS = d.pairs || [];
    const tipoMap = {};
    for (const p of ALL_PAIRS) {
      tipoMap[p.tipo] = (tipoMap[p.tipo] || 0) + 1;
    }
    for (const [tipo, cnt] of Object.entries(tipoMap)) {
      const el = document.getElementById('cnt-' + tipo);
      if (el) el.textContent = cnt;
    }
  } catch(e) {
    ALL_PAIRS = [];
  }

  // Load conflictología DB
  try {
    const r = await fetch('/api/conflictologia-db');
    const d = await r.json();
    CONFLICTO_DB = d.systems || {};
    // Set counts
    const sysMap = {
      respiratorio: 'respiratorio', digestivo: 'digestivo',
      cardiovascular: 'cardiovascular', locomotor: 'locomotor',
      genital: 'genital', urinario: 'urinario', endocrino: 'endocrino',
      inmunologico: 'inmunologico', piel: 'piel', neurosensorial: 'neurosensorial'
    };
    for (const [key, slug] of Object.entries(sysMap)) {
      const sys = CONFLICTO_DB[key];
      if (!sys) continue;
      const total = Object.values(sys.subsystems).reduce((s, sub) => s + sub.conflicts.length, 0);
      const el = document.getElementById('cnt-conf-' + slug);
      if (el) el.textContent = total;
    }
  } catch(e) {
    CONFLICTO_DB = {};
  }

  renderCurrent();
}

// ─── Category selection ───────────────────────────────────────────────────────
function selectCat(btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  document.getElementById('searchBox').value = '';
  document.getElementById('sisFilter').value = '';
  renderCurrent();
}

function renderCurrent() {
  const staticCats = ['sales','bach','vitaminas','creencias','miedos',
    'policrestos','semipolicrestos','chakras_primarios','chakras_secundarios',
    'cinco_elementos','aminoacidos','enzimas'];
  if (currentCat.startsWith('conflicto_')) {
    renderConflictologia(currentCat.replace('conflicto_', ''));
  } else if (staticCats.includes(currentCat)) {
    renderStatic(currentCat);
  } else {
    renderPairs(currentCat);
  }
}

// ─── Conflictología rendering ─────────────────────────────────────────────────
function renderConflictologia(sysKey) {
  document.getElementById('sisFilter').value = '';
  const query = (document.getElementById('searchBox').value || '').toLowerCase();
  const sys = CONFLICTO_DB[sysKey];

  const sysLabels = {
    respiratorio:'Sistema Respiratorio', digestivo:'Sistema Digestivo',
    cardiovascular:'Sistema Cardiovascular', locomotor:'Sistema Locomotor / Osteomuscular',
    genital:'Sistema Reproductor', urinario:'Sistema Urinario / Renal',
    endocrino:'Sistema Endócrino-Metabólico', inmunologico:'Sistema Inmunológico / Linfático',
    piel:'Sistema Lipofascial / Dermatológico', neurosensorial:'Sistema Neurosensorial'
  };

  const title = sysLabels[sysKey] || sysKey;
  document.getElementById('categoryLabel').textContent = title;
  const scroll = document.getElementById('tableScroll');

  if (!sys || !sys.subsystems || Object.keys(sys.subsystems).length === 0) {
    scroll.innerHTML = `<div class="empty-state"><p>No hay datos de conflictología para este sistema.</p></div>`;
    return;
  }

  let total = Object.values(sys.subsystems).reduce((s, sub) => s + sub.conflicts.length, 0);

  let html = `<div class="category-title" style="color:#ff9f6b">${escHtml(title)}</div>
    <div class="category-sub">Conflictología psicosomática — ${total} conflictos en ${Object.keys(sys.subsystems).length} subsistemas</div>`;

  for (const [slug, sub] of Object.entries(sys.subsystems)) {
    // Filter by query
    let conflicts = sub.conflicts;
    if (query) {
      conflicts = conflicts.filter(c =>
        c.nombre.toLowerCase().includes(query) ||
        (c.desc || '').toLowerCase().includes(query)
      );
      if (!conflicts.length) continue;
    }

    html += `<div style="margin-bottom:16px">
      <div style="font-size:.7rem;font-weight:700;color:#ff9f6b;text-transform:uppercase;letter-spacing:.07em;padding:8px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px">
        ${escHtml(sub.label)} <span style="color:var(--muted);font-weight:400;text-transform:none">(${conflicts.length})</span>
      </div>
      <div class="items-grid">`;

    for (const c of conflicts) {
      const cid = 'conf_' + sysKey + '_' + btoa(encodeURIComponent(c.nombre)).replace(/[^a-z0-9]/gi,'').slice(0,16);
      const isChk = confirmed.some(x => x.id === cid);
      const hasDesc = c.desc && c.desc !== c.nombre;
      html += `<div class="item-row ${isChk?'checked':''}" onclick="toggleConflicto('${cid}','${escHtml(c.nombre).replace(/'/g,"\\'")}','${sysKey}','${escHtml(sub.label).replace(/'/g,"\\'")}')">
        <input type="checkbox" class="item-cb" ${isChk?'checked':''} onclick="event.stopPropagation();toggleConflicto('${cid}','${escHtml(c.nombre).replace(/'/g,"\\'")}','${sysKey}','${escHtml(sub.label).replace(/'/g,"\\'")}')"/>
        <div class="item-body">
          <div class="item-nombre">${escHtml(c.nombre)}</div>
          ${hasDesc?`<div class="item-condiciones" style="color:#c8b8e8;font-style:italic">${escHtml(c.desc)}</div>`:''}
        </div>
      </div>`;
    }
    html += `</div></div>`;
  }

  scroll.innerHTML = html;
}

function toggleConflicto(id, nombre, sysKey, subLabel) {
  const idx = confirmed.findIndex(c => c.id === id);
  if (idx >= 0) {
    confirmed.splice(idx, 1);
  } else {
    confirmed.push({ id, nombre, tipo: 'conflicto', cat: sysKey, sub: subLabel });
  }
  renderCurrent();
  renderConfirmed();
}

function renderPairs(tipo) {
  const query = (document.getElementById('searchBox').value || '').toLowerCase();
  const sistema = document.getElementById('sisFilter').value;

  let pairs = ALL_PAIRS.filter(p => p.tipo === tipo);

  if (sistema) {
    pairs = pairs.filter(p => (p.sistemas_afectados || []).includes(sistema));
  }
  if (query) {
    pairs = pairs.filter(p =>
      p.nombre.toLowerCase().includes(query) ||
      (p.condiciones||'').toLowerCase().includes(query) ||
      (p.significado_emocional||'').toLowerCase().includes(query)
    );
  }

  const catNames = {
    bacteria:'Bacterias', virus:'Virus', hongo:'Hongos', parasito:'Parásitos',
    emocional:'Emocionales', disfuncional:'Disfuncionales', especial:'Especiales',
    reservorio:'Reservorios', desconocido:'Desconocidos'
  };
  const catColors = {
    bacteria:'#e05c5c',virus:'#f07c40',hongo:'#f0c060',parasito:'#4caf7d',
    emocional:'#7c6df0',disfuncional:'#5b8fff',especial:'#ff85b3',
    reservorio:'#7ae0c0',desconocido:'#7a7a9a'
  };
  document.getElementById('categoryLabel').textContent = catNames[tipo] || tipo;

  const scroll = document.getElementById('tableScroll');

  if (!pairs.length) {
    scroll.innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <p>Sin resultados para esta búsqueda.</p>
      </div>`;
    return;
  }

  const color = catColors[tipo] || '#888';
  let html = `
    <div class="category-title" style="color:${color}">${catNames[tipo]||tipo}</div>
    <div class="category-sub">${pairs.length} par${pairs.length!==1?'es':''} encontrado${pairs.length!==1?'s':''}</div>
    <div class="items-grid">`;

  for (const p of pairs) {
    const isChk = confirmed.some(c => c.id === p.id);
    const siss = (p.sistemas_afectados||[]).join(', ');
    html += `
      <div class="item-row ${isChk?'checked':''}" onclick="togglePair('${escId(p.id)}')">
        <input type="checkbox" class="item-cb" ${isChk?'checked':''} onclick="event.stopPropagation();togglePair('${escId(p.id)}')"/>
        <div class="item-body">
          <div class="item-nombre">${escHtml(p.nombre)}</div>
          ${p.condiciones?`<div class="item-condiciones">${escHtml(p.condiciones)}</div>`:''}
          ${p.significado_emocional&&p.significado_emocional!==p.condiciones?`<div class="item-emocional">💜 ${escHtml(p.significado_emocional)}</div>`:''}
          <div class="item-tags">
            <span class="tag tag-tipo" style="color:${color}">${p.tipo_raw||p.tipo}</span>
            ${siss?`<span class="tag">${siss}</span>`:''}
          </div>
        </div>
      </div>`;
  }
  html += '</div>';
  scroll.innerHTML = html;
}

function escId(id) { return id.replace(/'/g,"\\'"); }

// ─── Toggle pair ──────────────────────────────────────────────────────────────
function togglePair(id) {
  const pair = ALL_PAIRS.find(p => p.id === id);
  if (!pair) return;
  const idx = confirmed.findIndex(c => c.id === id);
  if (idx >= 0) {
    confirmed.splice(idx, 1);
  } else {
    confirmed.push({
      id: pair.id,
      nombre: pair.nombre,
      tipo: pair.tipo,
      cat: currentCat,
      sub: pair.sistemas_afectados ? pair.sistemas_afectados.join(', ') : ''
    });
  }
  renderCurrent();
  renderConfirmed();
}

function toggleStatic(id, nombre, cat, catLabel) {
  const idx = confirmed.findIndex(c => c.id === id);
  if (idx >= 0) {
    confirmed.splice(idx, 1);
  } else {
    confirmed.push({ id, nombre, tipo: cat, cat, sub: catLabel });
  }
  renderCurrent();
  renderConfirmed();
}

// ─── Confirmed panel ──────────────────────────────────────────────────────────
function renderConfirmed() {
  const scroll = document.getElementById('confirmedScroll');
  const cnt = document.getElementById('confCount');
  const total = document.getElementById('totalConf');
  cnt.textContent = confirmed.length;
  total.textContent = confirmed.length;

  if (!confirmed.length) {
    scroll.innerHTML = '<div class="conf-empty">Marca ítems en la tabla para agregarlos aquí.</div>';
    return;
  }

  // Group by cat
  const groups = {};
  for (const c of confirmed) {
    const g = c.sub || c.cat || 'Otros';
    if (!groups[g]) groups[g] = [];
    groups[g].push(c);
  }

  let html = '';
  for (const [g, items] of Object.entries(groups)) {
    html += `<div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:6px 0 4px;font-weight:700">${escHtml(g)}</div>`;
    for (const item of items) {
      html += `<div class="conf-item">
        <div class="conf-item-body">
          <div class="conf-nombre">${escHtml(item.nombre)}</div>
        </div>
        <button class="conf-remove" onclick="removeConfirmed('${item.id.replace(/'/g,"\\'")}')">✕</button>
      </div>`;
    }
  }
  scroll.innerHTML = html;
}

function removeConfirmed(id) {
  confirmed = confirmed.filter(c => c.id !== id);
  renderCurrent();
  renderConfirmed();
}

function limpiarTodo() {
  if (!confirmed.length) return;
  if (confirm(`¿Limpiar los ${confirmed.length} ítems seleccionados?`)) {
    confirmed = [];
    renderCurrent();
    renderConfirmed();
  }
}

function copiarConfirmados() {
  if (!confirmed.length) { alert('No hay ítems seleccionados.'); return; }

  const groups = {};
  for (const c of confirmed) {
    const g = c.sub || c.cat || 'Otros';
    if (!groups[g]) groups[g] = [];
    groups[g].push(c);
  }

  let text = '📋 RASTREO CONFIRMADO\n';
  text += '━'.repeat(30) + '\n\n';
  for (const [g, items] of Object.entries(groups)) {
    text += `▸ ${g.toUpperCase()}\n`;
    for (const item of items) {
      text += `  • ${item.nombre}\n`;
    }
    text += '\n';
  }
  text += `Total: ${confirmed.length} ítem${confirmed.length!==1?'s':''}`;

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '✅ Copiado!';
    setTimeout(() => btn.textContent = '📋 Copiar lista', 2000);
  });
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
