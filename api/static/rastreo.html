<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Rastreo de Pares · Holoacadem-iA</title>
<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface2:#e8e8ed;
  --border:rgba(0,0,0,0.08); --text:#1d1d1f; --muted:#6e6e73;
  --acc:#3b82f6; --acc-dark:#2563eb;
  --green:#22c55e; --green-dark:#16a34a;
  --radius:14px; --shadow:0 2px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
body{display:grid;grid-template-rows:52px 1fr;height:100vh;overflow:hidden}

/* Header */
.header{display:flex;align-items:center;gap:10px;padding:0 18px;
  background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.home-btn{color:var(--muted);text-decoration:none;font-size:1.1rem;padding:4px 8px;
  border-radius:6px;transition:color .15s;line-height:1}
.home-btn:hover{color:var(--text)}
.header-title{font-weight:700;font-size:.92rem;color:var(--text)}
.header-sub{font-size:.68rem;color:var(--acc);font-weight:600}
.session-badge{margin-left:auto;background:var(--acc);color:#fff;
  border-radius:20px;padding:3px 12px;font-size:.75rem;font-weight:700;cursor:pointer;
  transition:background .15s}
.session-badge:hover{background:var(--acc-dark)}
.session-badge.empty{background:var(--surface2);color:var(--muted)}

/* Main layout */
.main{display:grid;grid-template-columns:1fr 300px;overflow:hidden;height:100%}

/* Wizard panel */
.wizard{padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}

/* Breadcrumb */
.breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:.75rem;color:var(--muted);min-height:22px}
.bc-sep{opacity:.4}
.bc-item{cursor:pointer;color:var(--acc);font-weight:500}
.bc-item:hover{text-decoration:underline}
.bc-current{color:var(--text);font-weight:600;cursor:default}

/* Step title */
.step-label{font-size:.68rem;font-weight:700;letter-spacing:.08em;
  color:var(--muted);text-transform:uppercase}
.step-question{font-size:1.05rem;font-weight:700;color:var(--text);margin-top:4px}

/* Grid of option buttons */
.options-grid{display:grid;gap:10px}
.options-grid.cols-2{grid-template-columns:1fr 1fr}
.options-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.options-grid.cols-auto{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.options-grid.cols-nums{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}

.opt-btn{
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);
  padding:14px 12px;cursor:pointer;transition:all .15s;text-align:left;
  display:flex;flex-direction:column;gap:4px;min-height:60px;justify-content:center
}
.opt-btn:hover{border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,130,246,.12);transform:translateY(-1px)}
.opt-btn.active{border-color:var(--acc);background:rgba(59,130,246,.06)}
.opt-btn .opt-num{font-size:.65rem;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.opt-btn .opt-name{font-size:.88rem;font-weight:600;color:var(--text);line-height:1.2}
.opt-btn .opt-count{font-size:.7rem;color:var(--muted)}

/* Result card */
.result-card{background:var(--surface);border:2px solid var(--green);border-radius:var(--radius);padding:18px 20px}
.result-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--green);margin-bottom:8px}
.result-pair{font-size:1.15rem;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:6px}
.result-path{font-size:.72rem;color:var(--muted)}
.result-actions{display:flex;gap:10px;margin-top:14px}
.btn-confirm{flex:1;background:var(--green);color:#fff;border:none;border-radius:10px;
  padding:12px;font-size:.88rem;font-weight:700;cursor:pointer;transition:background .15s}
.btn-confirm:hover{background:var(--green-dark)}
.btn-another{background:var(--surface2);color:var(--text);border:none;border-radius:10px;
  padding:12px 14px;font-size:.88rem;font-weight:600;cursor:pointer;transition:background .15s}
.btn-another:hover{background:#d1d1d6}

/* Sidebar: session */
.sidebar{background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sidebar-title{font-size:.82rem;font-weight:700;color:var(--text)}
.btn-finalize{background:var(--acc);color:#fff;border:none;border-radius:8px;
  padding:7px 14px;font-size:.75rem;font-weight:700;cursor:pointer;transition:background .15s}
.btn-finalize:hover{background:var(--acc-dark)}
.btn-finalize:disabled{background:var(--surface2);color:var(--muted);cursor:default}
.pairs-list{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pair-item{background:var(--bg);border-radius:10px;padding:10px 12px;
  display:flex;align-items:flex-start;gap:8px}
.pair-num{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;
  font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.pair-info{flex:1;min-width:0}
.pair-name{font-size:.8rem;font-weight:600;color:var(--text);line-height:1.3}
.pair-path{font-size:.65rem;color:var(--muted);margin-top:2px}
.pair-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;
  padding:2px 4px;border-radius:4px;transition:color .15s;flex-shrink:0}
.pair-remove:hover{color:#ef4444}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted);gap:8px;padding:24px;text-align:center}
.empty-state .icon{font-size:2rem;opacity:.4}
.empty-state p{font-size:.78rem;line-height:1.4}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:760px;
  max-height:90vh;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.2);transform:translateY(16px);transition:transform .2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-head h2{font-size:1.05rem;font-weight:700}
.modal-close{background:var(--surface2);border:none;border-radius:50%;width:32px;height:32px;
  cursor:pointer;font-size:1rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
.modal-section h3{font-size:.78rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.final-pairs-list{display:flex;flex-direction:column;gap:6px}
.final-pair{background:var(--bg);border-radius:10px;padding:10px 14px;
  display:flex;align-items:center;gap:10px}
.final-pair-num{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;
  font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.final-pair-name{font-size:.85rem;font-weight:600;color:var(--text);flex:1}
.final-pair-path{font-size:.68rem;color:var(--muted)}
.maps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.map-img{width:100%;border-radius:10px;cursor:zoom-in;transition:transform .15s;border:1px solid var(--border)}
.map-img:hover{transform:scale(1.02)}
.modal-actions{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0}
.btn-new-session{flex:1;background:var(--surface2);color:var(--text);border:none;
  border-radius:10px;padding:13px;font-size:.88rem;font-weight:600;cursor:pointer}
.btn-new-session:hover{background:#d1d1d6}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;
  display:flex;align-items:center;justify-content:center;cursor:zoom-out;
  opacity:0;pointer-events:none;transition:opacity .2s}
.lightbox.open{opacity:1;pointer-events:all}
.lightbox img{max-width:94vw;max-height:94vh;object-fit:contain;border-radius:8px}

/* Responsive */
@media(max-width:640px){
  .main{grid-template-columns:1fr}
  .sidebar{display:none}
}
</style>
</head>
<body>

<div class="header">
  <a href="/" class="home-btn" title="Inicio">⌂</a>
  <div>
    <div class="header-title">Rastreo de Pares Biomagnéticos</div>
    <div class="header-sub">Holoacadem-iA · Guía Interactiva</div>
  </div>
  <div class="session-badge empty" id="sessionBadge" onclick="openModal()">0 pares</div>
</div>

<div class="main">
  <!-- Wizard -->
  <div class="wizard" id="wizard">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="step-label" id="stepLabel">Paso 1 de 4</div>
    <div class="step-question" id="stepQuestion">¿En qué región necesita un par?</div>
    <div class="options-grid cols-2" id="optionsGrid"></div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Sesión actual</span>
      <button class="btn-finalize" id="btnFinalize" disabled onclick="openModal()">Finalizar</button>
    </div>
    <div class="pairs-list" id="pairsList">
      <div class="empty-state">
        <div class="icon">🧲</div>
        <p>Aquí aparecerán los pares<br>confirmados durante el rastreo</p>
      </div>
    </div>
  </div>
</div>

<!-- Modal final -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Resumen del Rastreo</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-new-session" onclick="newSession()">Nueva Sesión</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="Mapa de colocación">
</div>

<script>
// ─── State ───────────────────────────────────────────────
let DB = null;
let session = [];           // confirmed pairs
let step = 'region';        // region | zona | bloque | par | result
let selRegion = null;
let selZona   = null;
let selBloque = null;
let selPar    = null;

// ─── Boot ─────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch('/api/pares-db');
    DB = await r.json();
  } catch(e) {
    DB = { regiones: [] };
  }
  // Load session from localStorage
  try { session = JSON.parse(localStorage.getItem('pares_session') || '[]'); } catch(e) { session = []; }
  renderStep();
  renderSidebar();
}

// ─── Step rendering ───────────────────────────────────────
function renderStep() {
  updateBreadcrumb();
  switch(step) {
    case 'region': renderRegions(); break;
    case 'zona':   renderZonas(); break;
    case 'bloque': renderBloques(); break;
    case 'par':    renderPares(); break;
    case 'result': renderResult(); break;
  }
}

function renderRegions() {
  setQuestion('Paso 1 · Región', '¿En qué región del cuerpo?');
  const grid = getGrid('cols-2');
  DB.regiones.forEach(r => {
    const btn = makeOptBtn(r.icon + ' ' + r.nombre, r.numero + ' · ' + r.zonas.length + ' zonas');
    btn.onclick = () => { selRegion = r; step = 'zona'; renderStep(); };
    grid.appendChild(btn);
  });
}

function renderZonas() {
  setQuestion('Paso 2 · Zona', '¿En qué zona de ' + selRegion.nombre + '?');
  const cols = selRegion.zonas.length <= 3 ? 'cols-2' : 'cols-auto';
  const grid = getGrid(cols);
  selRegion.zonas.forEach(z => {
    const nPares = z.bloques.reduce((a,b) => a + b.pares.length, 0);
    const btn = makeOptBtn(z.numero + '. ' + z.nombre, z.bloques.length + ' bloques · ' + nPares + ' pares');
    btn.onclick = () => { selZona = z; step = 'bloque'; renderStep(); };
    grid.appendChild(btn);
  });
}

function renderBloques() {
  setQuestion('Paso 3 · Bloque', '¿Qué bloque dentro de ' + selZona.nombre + '?');
  const grid = getGrid('cols-auto');
  selZona.bloques.forEach(b => {
    const btn = makeOptBtn(b.numero + '. ' + b.nombre, b.pares.length + ' pares');
    btn.onclick = () => { selBloque = b; step = 'par'; renderStep(); };
    grid.appendChild(btn);
  });
}

function renderPares() {
  setQuestion('Paso 4 · Par', '¿Qué número de par?');
  document.getElementById('stepLabel').textContent = selBloque.nombre + ' · ' + selBloque.pares.length + ' pares';
  const grid = getGrid('cols-2');
  selBloque.pares.forEach((parName, i) => {
    const btn = makeOptBtn('Par ' + (i + 1), parName);
    btn.onclick = () => { selPar = i; step = 'result'; renderStep(); };
    grid.appendChild(btn);
  });
}

function renderResult() {
  const pairName = selBloque.pares[selPar];
  const path = selRegion.nombre + ' › ' + selZona.nombre + ' › ' + selBloque.nombre;

  setQuestion('✅ Par encontrado', '');
  document.getElementById('stepLabel').textContent = 'Par #' + (selPar + 1);

  const grid = document.getElementById('optionsGrid');
  grid.className = 'options-grid';
  grid.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'result-card';
  card.innerHTML = `
    <div class="result-label">Par #${selPar + 1} · ${selBloque.nombre}</div>
    <div class="result-pair">${pairName}</div>
    <div class="result-path">${path}</div>
    <div class="result-actions">
      <button class="btn-confirm" onclick="confirmPair()">✓ Confirmar par</button>
      <button class="btn-another" onclick="anotherPar()">Cambiar #</button>
    </div>
  `;
  grid.appendChild(card);
}

// ─── Actions ──────────────────────────────────────────────
function confirmPair() {
  const pair = {
    id: Date.now(),
    name: selBloque.pares[selPar],
    num: selPar + 1,
    bloque: selBloque.nombre,
    bloqueId: selBloque.id,
    zona: selZona.nombre,
    region: selRegion.nombre,
    path: selRegion.nombre + ' › ' + selZona.nombre + ' › ' + selBloque.nombre,
    regionId: selRegion.id
  };
  session.push(pair);
  saveSession();
  renderSidebar();
  // Go back to start for next pair
  resetWizard();
}

function anotherPar() {
  step = 'par';
  renderStep();
}

function resetWizard() {
  step = 'region';
  selRegion = selZona = selBloque = selPar = null;
  renderStep();
}

// ─── Breadcrumb ───────────────────────────────────────────
function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';
  const crumbs = [{ label: 'Región', target: 'region' }];
  if (selRegion) crumbs.push({ label: selRegion.nombre, target: 'zona' });
  if (selZona)   crumbs.push({ label: selZona.nombre, target: 'bloque' });
  if (selBloque) crumbs.push({ label: selBloque.nombre, target: 'par' });
  if (step === 'result') crumbs.push({ label: 'Par #' + (selPar+1), target: 'result' });

  crumbs.forEach((c, i) => {
    if (i > 0) { const sep = document.createElement('span'); sep.className='bc-sep'; sep.textContent='›'; bc.appendChild(sep); }
    const el = document.createElement('span');
    const isCurrent = i === crumbs.length - 1;
    el.className = isCurrent ? 'bc-current' : 'bc-item';
    el.textContent = c.label;
    if (!isCurrent) el.onclick = () => navigateTo(c.target);
    bc.appendChild(el);
  });
}

function navigateTo(target) {
  step = target;
  if (target === 'region') { selRegion = selZona = selBloque = selPar = null; }
  if (target === 'zona')   { selZona = selBloque = selPar = null; }
  if (target === 'bloque') { selBloque = selPar = null; }
  if (target === 'par')    { selPar = null; }
  renderStep();
}

// ─── Sidebar ──────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('pairsList');
  const badge = document.getElementById('sessionBadge');
  const btn = document.getElementById('btnFinalize');

  badge.textContent = session.length + (session.length === 1 ? ' par' : ' pares');
  badge.className = 'session-badge' + (session.length === 0 ? ' empty' : '');
  btn.disabled = session.length === 0;

  if (session.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">🧲</div><p>Aquí aparecerán los pares<br>confirmados durante el rastreo</p></div>`;
    return;
  }
  list.innerHTML = '';
  session.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'pair-item';
    item.innerHTML = `
      <div class="pair-num">${i+1}</div>
      <div class="pair-info">
        <div class="pair-name">${p.name}</div>
        <div class="pair-path">${p.path}</div>
      </div>
      <button class="pair-remove" onclick="removePair(${p.id})" title="Quitar">✕</button>
    `;
    list.appendChild(item);
  });
}

function removePair(id) {
  session = session.filter(p => p.id !== id);
  saveSession();
  renderSidebar();
}

function saveSession() {
  localStorage.setItem('pares_session', JSON.stringify(session));
}

function newSession() {
  if (!confirm('¿Iniciar una nueva sesión? Se borrarán los pares actuales.')) return;
  session = [];
  saveSession();
  closeModal();
  renderSidebar();
  resetWizard();
}

// ─── Mapa por bloque ──────────────────────────────────────
const BLOQUE_MAP = {
  // Cabeza – Coronilla
  pineal:'p0040',corona:'p0040',callosidad:'p0040',parietal:'p0040',
  // Cabeza – Posterior
  bulbo:'p0041',occipital:'p0041',cerebelo:'p0041',
  // Cabeza – Lateral
  temporal:'p0042',auricula:'p0042',posterior_lat:'p0042',
  sien:'p0042',mandibular:'p0042',parotida:'p0042',
  // Cabeza – Frente
  frente_alta:'p0043',hipofisis:'p0043',frente_baja:'p0043',
  // Cabeza – Rostro
  ojo:'p0044',anillo_ocular:'p0044',pomulo:'p0044',nariz:'p0044',boca:'p0044',
  // Cabeza – Cuello
  garganta_central:'p0045',garganta_baja:'p0045',garganta_lateral:'p0045',
  nuca:'p0046',
  // Tronco – Tórax
  collar:'p0047',timo:'p0047',anahata:'p0047',pecho_bajo:'p0047',
  cavidad:'p0047',diafragma:'p0047',corazon:'p0047',pecho_lateral:'p0047',pleura:'p0047',
  // Tronco – Hepatitis
  hepatitis_b1:'p0048',hepatitis_b2:'p0048',hepatitis_b3:'p0048',
  // Tronco – Abdomen
  estomago:'p0049',piloro:'p0049',higado:'p0049',zona_hepatica:'p0049',
  vesicula:'p0049',bazo:'p0049',pancreas:'p0049',ombligo:'p0049',
  interseccion:'p0049',colon:'p0049',
  // Tronco – Espalda
  dorsales:'p0051',espalda_alta:'p0051',homoplato:'p0051',
  retrohepatico:'p0051',rinon:'p0051',espalda_baja:'p0051',
  // Pelvis – Delantera
  pubis:'p0052',cadera:'p0052',femur:'p0052',
  // Pelvis – Trasera
  sacro:'p0053',coxis:'p0053',trasero:'p0053',
  // Pelvis – Sexo
  femina_a:'p0054',femina_b:'p0054',macho:'p0054',
  // Miembros – Brazos
  brazo_alto:'p0055',brazo_medio:'p0055',mano:'p0055',
  // Miembros – Piernas
  pierna_alta:'p0056',pierna_media:'p0056',pierna_trasera:'p0056',pie:'p0056',
  // Extras
  variables_a:'p0057',variables_b:'p0057',personalizado:'p0057',
  predeterminados:'p0057',homologos:'p0057',
  rastreo_cervical:'p0057',rastreo_dorsal:'p0057',rastreo_lumbar:'p0057',
  rastreo_sacro:'p0057',rastreo_coxis:'p0057',
  eje_vertical:'p0058',eje_horizontal:'p0058',eje_transverso:'p0058'
};

function getMapUrl(bloqueId) {
  const page = BLOQUE_MAP[bloqueId];
  if (!page) return null;
  return `/tablas-assets/pares_biomagneticos/HOLOBIOMAGNETISMO_PARTE_1_${page}.jpg`;
}

// ─── Modal ────────────────────────────────────────────────
function openModal() {
  if (session.length === 0) return;

  const body = document.getElementById('modalBody');
  body.innerHTML = '';

  session.forEach((p, i) => {
    const section = document.createElement('div');
    section.className = 'modal-section';

    const mapUrl = getMapUrl(p.bloqueId);
    const mapHTML = mapUrl
      ? `<img class="map-img" src="${mapUrl}" alt="Mapa ${p.bloque}" loading="lazy" onclick="openLightbox('${mapUrl}')" style="max-height:320px;object-fit:contain;">`
      : `<div style="background:var(--bg);border-radius:10px;padding:16px;color:var(--muted);font-size:.8rem;text-align:center;">Sin mapa disponible para esta zona</div>`;

    section.innerHTML = `
      <div class="final-pair" style="margin-bottom:10px;">
        <div class="final-pair-num">${i+1}</div>
        <div style="flex:1">
          <div class="final-pair-name">${p.name}</div>
          <div class="final-pair-path">${p.path}</div>
        </div>
      </div>
      <h3>📍 Mapa de colocación · ${p.bloque}</h3>
      ${mapHTML}
    `;
    body.appendChild(section);
  });

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

// ─── Helpers ──────────────────────────────────────────────
function setQuestion(label, question) {
  document.getElementById('stepLabel').textContent = label;
  document.getElementById('stepQuestion').textContent = question;
}

function getGrid(cls) {
  const grid = document.getElementById('optionsGrid');
  grid.className = 'options-grid ' + cls;
  grid.innerHTML = '';
  return grid;
}

function makeOptBtn(name, sub) {
  const btn = document.createElement('button');
  btn.className = 'opt-btn';
  btn.innerHTML = `<div class="opt-name">${name}</div><div class="opt-count">${sub}</div>`;
  return btn;
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Keyboard: Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLightbox(); closeModal(); }
});

init();
</script>
</body>
</html>
