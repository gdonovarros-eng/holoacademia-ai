<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sinastría · Astrolog iA</title><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="/therapy-static/holo_design_system.css?v=4"><link rel="stylesheet" href="/therapy-static/holo_module.css?v=1"><link rel="stylesheet" href="/therapy-static/holo_module_override.css?v=1"><style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0b1120; --surface: #111827; --surface2: #1a2236;
  --border: rgba(255,255,255,0.08); --text: #f1f5f9; --muted: #94a3b8;
  --acc: #ec4899; --acc2: #8b5cf6; --radius: 16px;
}
html, body { min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }

/* HEADER */
.header { display:flex; align-items:center; gap:14px; padding:18px 28px; border-bottom:1px solid var(--border); background:rgba(11,17,32,0.9); backdrop-filter:blur(12px); position:sticky; top:0; z-index:100; }
.header-back { display:flex; align-items:center; gap:6px; font-size:0.82rem; font-weight:600; color:var(--muted); text-decoration:none; padding:6px 12px; border-radius:8px; border:1px solid var(--border); transition:all 0.15s; }
.header-back:hover { color:var(--text); border-color:rgba(255,255,255,0.15); background:rgba(255,255,255,0.04); }
.header-title { flex:1; display:flex; align-items:center; gap:10px; }
.header-badge { font-size:0.65rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--acc); background:rgba(236,72,153,0.1); border:1px solid rgba(236,72,153,0.25); border-radius:20px; padding:3px 10px; }

/* MAIN */
.main { max-width:860px; margin:0 auto; padding:36px 24px 60px; }

/* PERSONAS GRID */
.personas-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }

/* FORM CARD */
.form-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px 22px; position:relative; overflow:hidden; }
.form-card.persona-a::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,#ec4899,#f472b6); }
.form-card.persona-b::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,#8b5cf6,#a78bfa); }

.persona-label { display:flex; align-items:center; gap:8px; margin-bottom:18px; }
.persona-icon { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1rem; flex-shrink:0; }
.persona-a .persona-icon { background:rgba(236,72,153,0.15); }
.persona-b .persona-icon { background:rgba(139,92,246,0.15); }
.persona-name-label { font-size:0.82rem; font-weight:700; }
.persona-a .persona-name-label { color:#f472b6; }
.persona-b .persona-name-label { color:#a78bfa; }

.form-group { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.form-group:last-child { margin-bottom:0; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
label { font-size:0.72rem; font-weight:600; color:var(--muted); letter-spacing:0.05em; text-transform:uppercase; }
input[type="text"], input[type="date"], input[type="time"] {
 background:var(--surface2); border:1px solid var(--border); border-radius:10px;
 padding:10px 12px; font-size:0.86rem; color:var(--text); outline:none; width:100%;
 font-family:inherit; -webkit-appearance:none; transition:border-color 0.15s, box-shadow 0.15s;
}
input::placeholder { color:rgba(148,163,184,0.35); }
.persona-a input:focus { border-color:rgba(236,72,153,0.5); box-shadow:0 0 0 3px rgba(236,72,153,0.08); }
.persona-b input:focus { border-color:rgba(139,92,246,0.5); box-shadow:0 0 0 3px rgba(139,92,246,0.08); }

/* SUBMIT */
.btn-submit { width:100%; padding:14px; background:linear-gradient(135deg,#ec4899,#8b5cf6); border:none; border-radius:12px; color:#fff; font-size:0.95rem; font-weight:800; cursor:pointer; transition:opacity 0.2s,transform 0.15s,box-shadow 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:4px; }
.btn-submit:hover:not(:disabled) { opacity:0.9; transform:translateY(-1px); box-shadow:0 6px 20px rgba(139,92,246,0.3); }
.btn-submit:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

/* RESULTADO */
.result-card { display:none; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-top:20px; }
.result-card.visible { display:block; }
.result-header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:12px; background:linear-gradient(135deg, rgba(236,72,153,0.04), rgba(139,92,246,0.04)); }
.result-header::before { content:''; position:absolute; /* noop */ }
.result-status { font-size:0.8rem; font-weight:500; color:var(--muted); }
.result-status.streaming { color:#f472b6; }
.result-status.done { color:#34d399; }
.result-status.error { color:#f87171; }
.status-bar { display:flex; align-items:center; gap:10px; padding:12px 24px; border-bottom:1px solid var(--border); font-size:0.8rem; color:var(--muted); background:var(--surface2); }
.status-bar.hidden { display:none; }
.spinner { width:14px; height:14px; border:2px solid rgba(236,72,153,0.3); border-top-color:var(--acc); border-radius:50%; animation:spin 0.7s linear infinite; flex-shrink:0; }
@keyframes spin { to { transform:rotate(360deg); } }

/* TABS */
.tab-bar { display:flex; gap:6px; padding:14px 20px; border-bottom:1px solid var(--border); }
.tab-btn { padding:6px 14px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:0.78rem; font-weight:600; cursor:pointer; transition:all 0.15s; font-family:inherit; }
.tab-btn:hover { border-color:rgba(236,72,153,0.35); color:var(--text); }
.tab-btn.active { background:rgba(236,72,153,0.1); border-color:rgba(236,72,153,0.4); color:var(--acc); }

.tab-content { display:none; }
.tab-content.active { display:block; }

/* ANÁLISIS */
.analysis-body { padding:28px 32px; max-height:75vh; overflow-y:auto; scrollbar-width:thin; }
.md-content { line-height:1.75; font-size:0.9rem; color:var(--text); }
.md-content h1 { font-size:1.3rem; font-weight:800; margin:0 0 16px; background:linear-gradient(90deg,#ec4899,#8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.md-content h2 { font-size:1.05rem; font-weight:700; margin:28px 0 10px; color:#f472b6; border-bottom:1px solid rgba(236,72,153,0.15); padding-bottom:6px; }
.md-content h3 { font-size:0.95rem; font-weight:700; margin:20px 0 8px; color:var(--text); }
.md-content p { margin-bottom:12px; }
.md-content ul, .md-content ol { padding-left:22px; margin-bottom:12px; }
.md-content li { margin-bottom:4px; }
.md-content strong { color:#f472b6; font-weight:700; }
.md-content em { color:#a5b4fc; }
.md-content hr { border:none; border-top:1px solid var(--border); margin:20px 0; }
.md-content blockquote { border-left:3px solid var(--acc); margin:12px 0; padding:8px 16px; background:rgba(236,72,153,0.05); border-radius:0 8px 8px 0; color:var(--muted); font-style:italic; }

/* CARTA SVG */
.carta-body { padding:24px; display:flex; justify-content:center; }
.carta-svg-wrap { width:100%; max-width:580px; aspect-ratio:1; }
.carta-loading { display:flex; flex-direction:column; align-items:center; gap:12px; color:var(--muted); font-size:0.85rem; padding:40px; }

/* ASPECTOS TABLE */
.asp-body { padding:20px 24px; max-height:60vh; overflow-y:auto; scrollbar-width:thin; }
.asp-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
.asp-table th { background:rgba(236,72,153,0.08); color:#f472b6; font-weight:700; padding:8px 12px; text-align:left; border-bottom:1px solid var(--border); font-size:0.72rem; letter-spacing:0.07em; text-transform:uppercase; }
.asp-table td { padding:8px 12px; border-bottom:1px solid rgba(255,255,255,0.04); }
.asp-table tr:hover td { background:rgba(255,255,255,0.02); }
.asp-badge { display:inline-block; font-size:0.68rem; font-weight:700; padding:2px 7px; border-radius:4px; }
.asp-conj  { background:rgba(52,211,153,0.15); color:#34d399; }
.asp-trig  { background:rgba(96,165,250,0.15); color:#60a5fa; }
.asp-sext  { background:rgba(167,139,250,0.15); color:#a78bfa; }
.asp-oposi { background:rgba(248,113,113,0.15); color:#f87171; }
.asp-cuad  { background:rgba(251,146,60,0.15); color:#fb923c; }
.asp-quin  { background:rgba(148,163,184,0.15); color:#94a3b8; }

.btn-copy { background:transparent; border:1px solid var(--border); border-radius:8px; padding:6px 12px; color:var(--muted); font-size:0.75rem; cursor:pointer; transition:all 0.15s; font-family:inherit; }
.btn-copy:hover { border-color:rgba(255,255,255,0.15); color:var(--text); }

.cursor { display:inline-block; width:2px; height:1em; background:var(--acc); border-radius:1px; animation:blink 0.8s ease infinite; vertical-align:text-bottom; margin-left:2px; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0} }

@media (max-width:680px) {
  .personas-grid { grid-template-columns:1fr; }
  .main { padding:20px 16px 48px; }
  .form-row { grid-template-columns:1fr; }
  .analysis-body { padding:18px; }
}
</style></head><body class="mod-page-aurora"><header class="header"><a class="header-back" href="/astro-home" id="backBtn">← Astrolog iA</a><div class="header-title"><span style="font-size:1.2rem;"></span><span style="font-size:0.95rem;font-weight:700;">Sinastría & Compatibilidad</span><span class="header-badge">Astrolog iA</span></div></header><div class="main"><!-- FORMULARIO --><div class="personas-grid"><!-- Persona A --><div class="form-card persona-a"><div class="persona-label"><div class="persona-icon"></div><span class="persona-name-label">Persona A</span></div><div class="form-group"><label>Nombre</label><input type="text" id="nombreA" placeholder="Nombre completo" autocomplete="off"></div><div class="form-row"><div class="form-group"><label>Fecha de nacimiento</label><input type="date" id="fechaA"></div><div class="form-group"><label>Hora</label><input type="time" id="horaA"></div></div><div class="form-group"><label>Lugar de nacimiento</label><input type="text" id="lugarA" placeholder="Ciudad, País" autocomplete="off"></div></div><!-- Persona B --><div class="form-card persona-b"><div class="persona-label"><div class="persona-icon"></div><span class="persona-name-label">Persona B</span></div><div class="form-group"><label>Nombre</label><input type="text" id="nombreB" placeholder="Nombre completo" autocomplete="off"></div><div class="form-row"><div class="form-group"><label>Fecha de nacimiento</label><input type="date" id="fechaB"></div><div class="form-group"><label>Hora</label><input type="time" id="horaB"></div></div><div class="form-group"><label>Lugar de nacimiento</label><input type="text" id="lugarB" placeholder="Ciudad, País" autocomplete="off"></div></div></div><button class="btn-submit" id="btnSubmit"><span></span><span id="btnLabel">Analizar compatibilidad</span></button><!-- RESULTADO --><div class="result-card" id="resultCard"><div class="result-header"><div style="display:flex;align-items:center;gap:8px;"><span style="font-size:1rem;"></span><span id="resultTitle" style="font-size:0.9rem;font-weight:700;">Análisis de Compatibilidad</span></div><div style="display:flex;align-items:center;gap:10px;"><span class="result-status" id="resultStatus"></span><button class="btn-copy" id="btnCopy" style="display:none;">Copiar</button></div></div><div class="status-bar" id="statusBar"><div class="spinner"></div><span id="statusMsg">Iniciando...</span></div><!-- TABS --><div class="tab-bar"><button class="tab-btn active" id="tabAnalisis" onclick="showTab('analisis')">Análisis IA</button><button class="tab-btn" id="tabCarta" onclick="showTab('carta')">Carta Doble</button><button class="tab-btn" id="tabAspectos" onclick="showTab('aspectos')">Aspectos Cruzados</button></div><!-- Análisis --><div class="tab-content active" id="panelAnalisis"><div class="analysis-body"><div class="md-content" id="mdContent"></div></div></div><!-- Carta doble --><div class="tab-content" id="panelCarta"><div class="carta-body" id="cartaBody"><div class="carta-loading" id="cartaLoading"><div class="spinner"></div><span>Generando carta de sinastría...</span></div><div class="carta-svg-wrap" id="cartaSvgWrap" style="display:none;"></div></div></div><!-- Aspectos cruzados --><div class="tab-content" id="panelAspectos"><div class="asp-body"><table class="asp-table"><thead><tr><th id="colA">Planeta A</th><th>Aspecto</th><th id="colB">Planeta B</th><th>Orbe</th><th>Energía</th></tr></thead><tbody id="aspTableBody"></tbody></table></div></div></div></div><script>
(function() {
  /* EMBED */
 const isEmbed = new URLSearchParams(window.location.search).has('embed');
 if (isEmbed) {
 document.body.classList.add('embed-mode');
 document.getElementById('backBtn').target = '_top';
 function sendH() { window.parent.postMessage({type:'iframeHeight',height:document.body.scrollHeight},'*'); }
 sendH(); new ResizeObserver(sendH).observe(document.body);
  }

 const NOMBRE_P = {
 sun:'Sol',moon:'Luna',mercury:'Mercurio',venus:'Venus',mars:'Marte',
 jupiter:'Júpiter',saturn:'Saturno',uranus:'Urano',neptune:'Neptuno',
 pluto:'Plutón',true_node:'Nodo Norte',chiron:'Quirón'
  };
 const ASP_CLASS = {
    'conjunción':'asp-conj','trígono':'asp-trig','sextil':'asp-sext',
    'oposición':'asp-oposi','cuadrado':'asp-cuad','quincuncio':'asp-quin'
  };
 const ASP_ENERGIA = {
    'conjunción':'Fusión / énfasis','trígono':'Fluidez / talento',
    'sextil':'Oportunidad / apoyo','oposición':'Tensión / aprendizaje',
    'cuadrado':'Desafío / crecimiento','quincuncio':'Ajuste / adaptación'
  };

 let rawText='', hadError=false, cursor=null, svgLoaded=false;
 let _payload=null, _crossData=null;

 const btnSubmit = document.getElementById('btnSubmit');
 const btnLabel  = document.getElementById('btnLabel');
 const resultCard= document.getElementById('resultCard');
 const resultTitle=document.getElementById('resultTitle');
 const resultStatus=document.getElementById('resultStatus');
 const statusBar = document.getElementById('statusBar');
 const statusMsg = document.getElementById('statusMsg');
 const mdContent = document.getElementById('mdContent');
 const btnCopy   = document.getElementById('btnCopy');

  /* TABS */
 window.showTab = function(tab) {
    ['analisis','carta','aspectos'].forEach(t => {
 document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active', t===tab);
 document.getElementById('panel'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active', t===tab);
    });
 if (tab==='carta' && !svgLoaded && _payload) loadSvg();
  };

  /* SVG */
 function loadSvg() {
 if (!_payload) return;
 document.getElementById('cartaLoading').style.display='flex';
 document.getElementById('cartaSvgWrap').style.display='none';
 fetch('/astro/carta-sinastria', {
 method:'POST', headers:{'Content-Type':'application/json'},
 body: JSON.stringify(_payload)
    }).then(r => { if(!r.ok) return r.text().then(t=>{throw new Error(t)}); return r.text(); })
    .then(svg => {
 document.getElementById('cartaLoading').style.display='none';
 const w = document.getElementById('cartaSvgWrap');
 w.innerHTML = svg;
 w.style.display = 'block';
 svgLoaded = true;
    }).catch(e => {
 document.getElementById('cartaLoading').innerHTML = '<p style="color:#f87171">Error: '+e.message+'</p>';
    });
  }

  /* ASPECTOS TABLE */
 function fillAspTable(nombre_a, nombre_b, cross) {
 document.getElementById('colA').textContent = nombre_a;
 document.getElementById('colB').textContent = nombre_b;
 const tbody = document.getElementById('aspTableBody');
 tbody.innerHTML = cross.map(a => {
 const pA = NOMBRE_P[a.planeta_a]||a.planeta_a;
 const pB = NOMBRE_P[a.planeta_b]||a.planeta_b;
 const cls = ASP_CLASS[a.aspecto]||'';
 const en  = ASP_ENERGIA[a.aspecto]||a.aspecto;
 return `<tr><td><strong>${pA}</strong><small style="color:var(--muted)">${a.signo_a||''}</small></td><td><span class="asp-badge ${cls}">${a.aspecto}</span></td><td><strong>${pB}</strong><small style="color:var(--muted)">${a.signo_b||''}</small></td><td style="color:var(--muted)">${a.orbe}°</td><td style="color:var(--muted);font-size:0.78rem">${en}</td></tr>`;
    }).join('');
  }

  /* CURSOR */
 function addCursor() {
 removeCursor();
 cursor = document.createElement('span');
 cursor.className='cursor';
 mdContent.appendChild(cursor);
  }
 function removeCursor() {
 if(cursor && cursor.parentNode) cursor.parentNode.removeChild(cursor);
 cursor=null;
  }

  /* RENDER */
 let renderTimer=null;
 function schedRender() {
 if(renderTimer) clearTimeout(renderTimer);
 renderTimer = setTimeout(()=>{
 removeCursor();
 mdContent.innerHTML = marked.parse(rawText);
 if(resultStatus.classList.contains('streaming')) addCursor();
    }, 60);
  }

  /* SUBMIT */
 btnSubmit.addEventListener('click', function() {
 const nombreA=document.getElementById('nombreA').value.trim();
 const fechaA =document.getElementById('fechaA').value;
 const horaA  =document.getElementById('horaA').value;
 const lugarA =document.getElementById('lugarA').value.trim();
 const nombreB=document.getElementById('nombreB').value.trim();
 const fechaB =document.getElementById('fechaB').value;
 const horaB  =document.getElementById('horaB').value;
 const lugarB =document.getElementById('lugarB').value.trim();

 if (!nombreA||!fechaA||!horaA||!lugarA||!nombreB||!fechaB||!horaB||!lugarB) {
 alert('Por favor completa todos los campos de ambas personas.'); return;
    }

 _payload = { nombre_a:nombreA, fecha_a:fechaA, hora_a:horaA, lugar_a:lugarA,
 nombre_b:nombreB, fecha_b:fechaB, hora_b:horaB, lugar_b:lugarB };

 rawText=''; hadError=false; svgLoaded=false;
 mdContent.innerHTML='';
 btnCopy.style.display='none';
 document.getElementById('aspTableBody').innerHTML='';
 resultCard.classList.add('visible');
 resultTitle.textContent = nombreA + ' & ' + nombreB;
 resultStatus.textContent='Calculando...';
 resultStatus.className='result-status streaming';
 statusBar.classList.remove('hidden');
 statusMsg.textContent='Preparando...';
 btnSubmit.disabled=true;
 btnLabel.textContent='Analizando...';
 showTab('analisis');

 setTimeout(()=>{ resultCard.scrollIntoView({behavior:'smooth',block:'start'}); },200);

 fetch('/astro/sinastria-stream', {
 method:'POST', headers:{'Content-Type':'application/json','Accept':'text/event-stream'},
 body: JSON.stringify(_payload)
    }).then(res => {
 if(!res.ok) throw new Error('Error '+res.status);
 const reader=res.body.getReader(), dec=new TextDecoder();
 let buf='';

 function processLine(line) {
 if(!line.startsWith('data: ')) return;
 const d=line.slice(6).trim();
 if(d==='[DONE]') {
 removeCursor();
 if(!hadError) {
 mdContent.innerHTML=marked.parse(rawText);
 resultStatus.textContent='Completado';
 resultStatus.className='result-status done';
 btnCopy.style.display='inline-flex';
            // Precargar tabla de aspectos en background
 if(_crossData) fillAspTable(nombreA, nombreB, _crossData);
          }
 statusBar.classList.add('hidden');
 btnSubmit.disabled=false;
 btnLabel.textContent='Analizar compatibilidad';
 if(isEmbed) setTimeout(()=>window.parent.postMessage({type:'iframeHeight',height:document.body.scrollHeight},'*'),400);
 return;
        }
 try {
 const obj=JSON.parse(d);
 if(obj.status) statusMsg.textContent=obj.status;
 else if(obj.cross)   { _crossData=obj.cross; fillAspTable(nombreA,nombreB,obj.cross); }
 else if(obj.token!==undefined) { rawText+=obj.token; schedRender(); }
 else if(obj.error)   { hadError=true; resultStatus.textContent='Error'; resultStatus.className='result-status error'; mdContent.innerHTML='<p style="color:#f87171;padding:8px 0"> '+obj.error+'</p>'; btnSubmit.disabled=false; btnLabel.textContent='Reintentar'; }
        } catch(ex){}
      }

 function read() {
 reader.read().then(chunk=>{
 if(chunk.done) return;
 buf+=dec.decode(chunk.value,{stream:true});
 const lines=buf.split('\n'); buf=lines.pop();
 lines.forEach(processLine);
 read();
        }).catch(e=>{ resultStatus.textContent='Error de conexión'; resultStatus.className='result-status error'; statusBar.classList.add('hidden'); btnSubmit.disabled=false; btnLabel.textContent='Reintentar'; });
      }
 read();
    }).catch(e=>{ statusMsg.textContent='Error al conectar.'; statusBar.classList.add('hidden'); btnSubmit.disabled=false; btnLabel.textContent='Reintentar'; });
  });

  /* COPY */
 btnCopy.addEventListener('click',()=>{
 navigator.clipboard.writeText(rawText).then(()=>{ btnCopy.textContent='¡Copiado!'; setTimeout(()=>btnCopy.textContent='Copiar',2000); });
  });
})();
</script></body></html>
