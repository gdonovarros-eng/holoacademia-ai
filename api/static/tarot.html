<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tarot · Holoacadem-iA</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#faf7fc;--surface:#fff;--surface2:#f3eef8;--border:#e8e0f0;--acc:#9333ea;--acc-dim:rgba(147,51,234,.10);--acc-dark:#7e22ce;--text:#1e1b2e;--muted:#6b6480;--sidebar:#241b38;--sidebar2:#332650}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.6}
  .workspace{display:flex;height:100vh;overflow:hidden}
  .sidebar{width:248px;flex-shrink:0;background:var(--sidebar);color:#e9e2f5;display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
  .sb-brand .ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#a855f7,#9333ea);display:flex;align-items:center;justify-content:center}.sb-brand .ic svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2}
  .sb-brand .t{font-size:.85rem;font-weight:800}.sb-brand .s{font-size:.62rem;color:#a99fc8;text-transform:uppercase;letter-spacing:.05em}
  .sb-sec{font-size:.62rem;color:#9489b5;text-transform:uppercase;letter-spacing:.08em;padding:14px 10px 6px;font-weight:700}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;color:#cabfe2;font-size:.86rem;font-weight:600;transition:all .14s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
  .nav-item:hover{background:var(--sidebar2);color:#fff}.nav-item.active{background:var(--acc);color:#fff}
  .nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
  .nav-item .ct{margin-left:auto;font-size:.68rem;color:#9489b5;font-weight:700}.nav-item.active .ct{color:#e7d6ff}
  .sb-foot{margin-top:auto;padding-top:12px}
  .sb-home{display:flex;align-items:center;gap:8px;color:#a99fc8;text-decoration:none;font-size:.8rem;padding:9px 12px;border-radius:9px}.sb-home:hover{background:var(--sidebar2);color:#fff}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;display:flex;align-items:center;gap:14px}
  .topbar h1{font-size:1.05rem;font-weight:800;letter-spacing:-.02em}.topbar p{font-size:.8rem;color:var(--muted)}
  .topbar .back{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:7px 12px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text)}
  .panel{flex:1;overflow-y:auto;display:none}.panel.active{display:block}
  .scroller{padding:22px}
  .search{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:11px 15px;font-family:inherit;font-size:.92rem;color:var(--text)}
  .search:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-dim)}
  .count{font-size:.78rem;color:var(--muted);margin:10px 2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px}
  .sp-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:all .14s;border-left:4px solid var(--acc)}
  .sp-card:hover{box-shadow:0 8px 22px rgba(147,51,234,.13);transform:translateY(-2px)}
  .sp-card .nm{font-weight:800;font-size:1rem}
  .sp-card .nc{display:inline-block;background:var(--acc-dim);color:var(--acc-dark);font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:999px;margin:7px 0}
  .sp-card .de{font-size:.84rem;color:var(--muted);line-height:1.55}
  .board-wrap{max-width:920px;margin:0 auto}
  .purpose{background:var(--acc-dim);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin-bottom:14px}
  .purpose b{color:var(--acc-dark)}.purpose .de{font-size:.86rem;color:var(--text);margin-top:3px}.purpose .fu{font-size:.74rem;color:var(--muted);margin-top:4px}
  .qrow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .qrow input{flex:1;min-width:220px}
  .btn{background:var(--acc);color:#fff;border:none;border-radius:11px;padding:11px 18px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--acc-dark)}.btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn:disabled{opacity:.5;cursor:default}
  .board{position:relative;width:100%;max-width:680px;margin:0 auto;aspect-ratio:1/1;background:radial-gradient(circle at 50% 45%,#2c2247,#1c1530);border-radius:18px;border:1px solid #3a2d5c}
  .slot{position:absolute;width:12.5%;aspect-ratio:130/214;transform:translate(-50%,-50%);border-radius:7px;border:1.5px dashed rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:outline .12s}
  .slot.rot{transform:translate(-50%,-50%) rotate(90deg)}
  .slot .ph{color:rgba(255,255,255,.5);font-size:.7rem;font-weight:800}
  .slot img{width:100%;height:100%;object-fit:cover;border-radius:6px;display:block;box-shadow:0 3px 10px rgba(0,0,0,.4);animation:flip .4s ease both}
  .slot img.inv{transform:rotate(180deg)}
  .slot.sel{outline:3px solid #f0abfc;outline-offset:1px}
  .slot .num{position:absolute;top:-7px;left:-7px;width:18px;height:18px;border-radius:50%;background:var(--acc);color:#fff;font-size:.62rem;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}
  @keyframes flip{from{opacity:0;transform:rotateY(90deg)}to{opacity:1;transform:rotateY(0)}}
  .legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:16px}
  .leg{display:flex;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;cursor:pointer}
  .leg.sel{border-color:var(--acc);background:var(--acc-dim)}
  .leg .n{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .leg .pn{font-weight:700;font-size:.82rem}.leg .cn{font-size:.76rem;color:var(--muted)}
  .detail{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 18px;margin-top:16px}.detail:empty{display:none}
  .detail h3{font-size:1rem;font-weight:800;color:var(--acc-dark)}.detail .pos{font-size:.8rem;color:var(--muted);margin-bottom:8px}
  .detail .kw{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.kw span{background:var(--surface2);border-radius:6px;padding:3px 9px;font-size:.76rem}
  .reading{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 22px;margin-top:18px}.reading:empty{display:none}
  .reading h2{font-size:1.05rem;color:var(--acc-dark);font-weight:800;margin:16px 0 6px}.reading h3{font-size:.95rem;font-weight:700;margin:12px 0 4px}.reading p{margin:7px 0;font-size:.9rem;line-height:1.7}.reading strong{font-weight:700}.reading ul,.reading ol{padding-left:20px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .14s}
  .card:hover{box-shadow:0 8px 20px rgba(147,51,234,.13);transform:translateY(-2px)}
  .card img{width:100%;aspect-ratio:130/214;object-fit:cover;display:block;background:#2c2247}
  .card .cb{padding:9px 11px}.card .cn{font-weight:700;font-size:.84rem}.card .cg{font-size:.7rem;color:var(--muted)}
  .modal{position:fixed;inset:0;background:rgba(28,21,48,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal.open{display:flex}
  .modal-box{background:var(--surface);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;display:flex;gap:0}
  .modal-box img{width:180px;flex-shrink:0;object-fit:cover;border-radius:16px 0 0 16px;background:#2c2247}
  .modal-c{padding:20px 22px}@media(max-width:560px){.modal-box{flex-direction:column}.modal-box img{width:100%;height:220px;border-radius:16px 16px 0 0}}
  .modal-c h2{font-size:1.15rem;font-weight:800}.modal-c .g{font-size:.78rem;color:var(--muted);margin-bottom:8px}
  .mb-sec{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--acc-dark);font-weight:800;margin:14px 0 5px}
  .loading{text-align:center;color:var(--muted);padding:30px}
  /* selector de mazo */
  .deck-sel{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .deck-opt{flex:1;min-width:160px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:all .12s}
  .deck-opt.sel{border-color:var(--acc);background:var(--acc-dim)}
  .deck-opt.dis{opacity:.55;cursor:not-allowed}
  .deck-opt .thumb{width:30px;height:48px;border-radius:5px;object-fit:cover;background:#2c2247;flex-shrink:0}
  .deck-opt .dn{font-weight:800;font-size:.85rem}.deck-opt .dd{font-size:.7rem;color:var(--muted)}
  .deck-lbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin-bottom:6px}
  /* modos */
  .modes{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .modes button{background:var(--surface);border:none;padding:10px 15px;font-family:inherit;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--muted)}
  .modes button.on{background:var(--acc);color:#fff}
  /* dorso de carta dibujado */
  .cback{background:repeating-linear-gradient(45deg,#2e2150,#2e2150 6px,#39296a 6px,#39296a 12px);border:1px solid #6d5aa3;border-radius:7px;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.4)}
  .cback::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c4b5fd;font-size:1.1rem}
  .slot .nameph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.58rem;font-weight:700;color:#ede9fe;padding:3px;line-height:1.15}
  .slot .full{position:absolute;inset:0;border-radius:6px}
  /* mesa de barajeo y selección */
  #mesa{margin:16px auto 0;max-width:680px}#mesa:empty{display:none}
  .mesa-hint{text-align:center;font-size:.9rem;color:var(--acc-dark);font-weight:700;margin-bottom:12px}
  #shuffle{position:relative;width:110px;height:140px;margin:8px auto 4px}
  #shuffle .cback{position:absolute;inset:0}
  @keyframes riffleL{0%,100%{transform:translateX(0) rotate(0)}30%{transform:translateX(-46px) rotate(-7deg)}60%{transform:translateX(8px) rotate(2deg)}}
  @keyframes riffleR{0%,100%{transform:translateX(0) rotate(0)}30%{transform:translateX(46px) rotate(7deg)}60%{transform:translateX(-8px) rotate(-2deg)}}
  .montones{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
  .monton{position:relative;width:66px;height:104px;cursor:pointer;transition:transform .15s}
  .monton:hover{transform:translateY(-5px)}
  .monton.vacio{opacity:.25;pointer-events:none}
  .monton .cback{position:absolute;width:62px;height:100px}
  .monton .mc{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;font-size:.6rem;font-weight:800;padding:1px 7px;border-radius:999px}
  .flyer{position:fixed;z-index:70;border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform .6s cubic-bezier(.2,.7,.25,1);will-change:transform;backface-visibility:hidden}
  @media(max-width:760px){.workspace{flex-direction:column}.sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:8px;height:auto}.sb-brand,.sb-sec,.sb-foot{display:none}.nav-item{white-space:nowrap;width:auto}.board{max-width:100%}.slot{width:15%}}
</style></head><body>
<div class="workspace">
  <aside class="sidebar">
    <div class="sb-brand"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 6.5L21 9l-5 4.5L17.5 21 12 17.3 6.5 21 8 13.5 3 9l6.6-.5z"/></svg></div><div><div class="t">Tarot</div><div class="s">Mesa de lectura</div></div></div>
    <div class="sb-sec">Lectura</div>
    <button class="nav-item active" data-p="tiradas" onclick="nav('tiradas')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="6" height="14" rx="1"/><rect x="10" y="6" width="6" height="14" rx="1"/><rect x="17" y="4" width="4" height="12" rx="1"/></svg>Tiradas<span class="ct" id="ctTir"></span></button>
    <button class="nav-item" data-p="cartas" onclick="nav('cartas')"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Cartas<span class="ct" id="ctCar"></span></button>
    <button class="nav-item" data-p="consulta" onclick="nav('consulta')"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5z"/></svg>Consulta rápida</button>
    <div class="sb-foot"><a class="sb-home" href="/"><svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>Volver al inicio</a></div>
  </aside>
  <main class="main">
    <div class="topbar"><button class="back" id="backBtn" style="display:none" onclick="verCatalogo()">← Tiradas</button><div><h1 id="tbTitle">Tiradas</h1><p id="tbDesc">Elige una tirada: cada una dice para qué sirve y acomoda las cartas en su forma.</p></div></div>

    <section class="panel active" id="panel-tiradas">
      <div class="scroller" id="spreadCatalog"><div class="count" id="cntTir"></div><div class="grid" id="gridTir"></div></div>
      <div class="scroller" id="spreadBoard" style="display:none"><div class="board-wrap">
        <div class="purpose" id="purpose"></div>
        <div class="deck-lbl">Mazo</div>
        <div class="deck-sel" id="deckSel"></div>
        <div class="qrow" style="align-items:center">
          <input class="search" id="preg" placeholder="Tu pregunta o intención (opcional)">
          <div class="modes" id="modes"><button data-m="manual" onclick="setModo('manual')">Manual</button><button data-m="auto" onclick="setModo('auto')">Automático</button></div>
          <button class="btn" id="drawBtn" onclick="tirar()">Barajar y tirar</button>
          <button class="btn sec" onclick="leerTirada()" id="readBtn" disabled>Leer la tirada</button>
        </div>
        <div class="board" id="board"></div>
        <div id="mesa"></div>
        <div class="detail" id="detail"></div>
        <div class="legend" id="legend"></div>
        <div class="reading" id="reading"></div>
      </div></div>
    </section>

    <section class="panel" id="panel-cartas"><div class="scroller">
      <input class="search" id="qCar" placeholder="Buscar carta… (ej. La Torre, copas, muerte)" oninput="renderCartas()">
      <div class="count" id="cntCar"></div>
      <div class="grid" id="gridCar"></div>
    </div></section>

    <section class="panel" id="panel-consulta"><div class="scroller"><div class="board-wrap">
      <p style="color:var(--muted);font-size:.88rem;margin-bottom:14px">Haz una pregunta y recibe una lectura de tres cartas (pasado · presente · futuro) interpretada para ti.</p>
      <div class="qrow"><input class="search" id="cPreg" placeholder="¿Qué quieres consultar?"><button class="btn" onclick="consultaRapida()" id="cBtn">Consultar</button></div>
      <div id="cBoard"></div>
      <div class="reading" id="cReading"></div>
    </div></div></section>
  </main>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)cerrarCarta()"><div class="modal-box" id="modalBox"></div></div>
<script>
  let TIRADAS={}, MAZO=[], IMG={}, MBYNAME={}, DECKS={};
  let cur=null, drawn=[], selIdx=-1, picked=0, barajeando=false;
  let DECK=localStorage.getItem('tarot_deck')||'rws';
  let modo=localStorage.getItem('tarot_modo')||'manual';
  const DECK_META={rws:{label:'Rider-Waite-Smith',nota:'78 cartas · completo'},marsella:{label:'Tarot de Marsella',nota:'Arcanos Mayores'},thoth:{label:'Tarot Thoth',nota:'Crowley'}};
  const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const imgFor=name=>(IMG&&IMG[name])||'';

  async function cargar(){
    try{ const d=await(await fetch('/tarot/tiradas')).json(); TIRADAS=d.tiradas||{}; document.getElementById('ctTir').textContent=Object.keys(TIRADAS).length; renderCatalogo(); }catch(e){}
    try{ const m=await(await fetch('/tarot/mazo')).json(); MAZO=m.cartas||[]; MAZO.forEach(c=>MBYNAME[c.nombre]=c); document.getElementById('ctCar').textContent=MAZO.length; }catch(e){}
    try{ const dk=await(await fetch('/tarot/decks/scan')).json(); DECKS=dk.decks||{}; }catch(e){}
    if(!DECKS[DECK]||!Object.keys((DECKS[DECK]||{}).mapping||{}).length) DECK='rws';
    aplicarDeck(); setModo(modo);
  }
  function deckCount(id){ return Object.keys(((DECKS[id]||{}).mapping)||{}).length; }
  function aplicarDeck(){ IMG=((DECKS[DECK]||{}).mapping)||{}; renderDeckSel(); }
  function renderDeckSel(){
    const el=document.getElementById('deckSel'); if(!el)return;
    el.innerHTML=['rws','marsella','thoth'].map(id=>{
      const meta=DECK_META[id]||{label:id,nota:''}; const n=deckCount(id);
      const dis=n===0; const sample=Object.values(((DECKS[id]||{}).mapping)||{})[0]||'';
      return `<div class="deck-opt ${DECK===id?'sel':''} ${dis?'dis':''}" onclick="${dis?'':`setDeck('${id}')`}">
        ${sample?`<img class="thumb" src="${sample}" alt="">`:'<div class="thumb cback"></div>'}
        <div><div class="dn">${esc(meta.label)}</div><div class="dd">${dis?'sin imágenes':esc(meta.nota)+' · '+n}</div></div></div>`;
    }).join('');
  }
  function setDeck(id){ if(!deckCount(id))return; DECK=id; localStorage.setItem('tarot_deck',id); aplicarDeck(); if(cur)renderBoard(); if(document.getElementById('gridCar').childElementCount)renderCartas(); }
  function setModo(m){ modo=m; localStorage.setItem('tarot_modo',m); document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m)); }
  function nav(p){
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.p===p));
    document.querySelectorAll('.panel').forEach(s=>s.classList.toggle('active',s.id==='panel-'+p));
    const T={tiradas:['Tiradas','Elige una tirada: cada una dice para qué sirve y acomoda las cartas en su forma.'],cartas:['Cartas','Las 78 cartas con sus significados, sombra y pregunta terapéutica.'],consulta:['Consulta rápida','Una pregunta, una lectura de tres cartas interpretada.']};
    document.getElementById('tbTitle').textContent=(p==='tiradas'&&cur)?cur.nombre:T[p][0];
    document.getElementById('tbDesc').textContent=(p==='tiradas'&&cur)?(cur.num_cartas+' cartas'):T[p][1];
    document.getElementById('backBtn').style.display=(p==='tiradas'&&cur)?'':'none';
    if(p==='cartas'&&!document.getElementById('gridCar').childElementCount) renderCartas();
  }
  function renderCatalogo(){
    const ids=Object.keys(TIRADAS);
    document.getElementById('cntTir').textContent=ids.length+' tiradas';
    document.getElementById('gridTir').innerHTML=ids.map(id=>{const t=TIRADAS[id];
      return `<div class="sp-card" onclick="abrirTirada('${id}')"><div class="nm">${esc(t.nombre)}</div><div class="nc">${t.num_cartas} cartas</div><div class="de">${esc(t.descripcion||'')}</div></div>`;}).join('');
  }
  function verCatalogo(){ cur=null; document.getElementById('spreadBoard').style.display='none'; document.getElementById('spreadCatalog').style.display=''; document.getElementById('backBtn').style.display='none'; document.getElementById('tbTitle').textContent='Tiradas'; document.getElementById('tbDesc').textContent='Elige una tirada: cada una dice para qué sirve y acomoda las cartas en su forma.'; }
  function abrirTirada(id){
    cur=TIRADAS[id]; cur._id=id; drawn=[]; selIdx=-1;
    document.getElementById('spreadCatalog').style.display='none'; document.getElementById('spreadBoard').style.display='';
    document.getElementById('backBtn').style.display=''; document.getElementById('tbTitle').textContent=cur.nombre; document.getElementById('tbDesc').textContent=cur.num_cartas+' cartas';
    document.getElementById('purpose').innerHTML=`<b>Para qué sirve</b><div class="de">${esc(cur.descripcion||'')}</div>${cur.fuente?`<div class="fu">${esc(cur.fuente)}</div>`:''}`;
    document.getElementById('reading').innerHTML=''; document.getElementById('detail').innerHTML='';
    document.getElementById('readBtn').disabled=true;
    renderBoard();
  }
  function slotFace(d){
    if(!d||!d.shown) return '';
    const u=imgFor(d.carta);
    if(u) return `<img class="${d.invertida?'inv':''}" src="${u}" onerror="this.style.opacity=.15" alt="">`;
    return `<div class="full cback"></div><div class="nameph">${esc(d.carta)}${d.invertida?'<br>(inv)':''}</div>`;
  }
  function renderBoard(){
    const b=document.getElementById('board');
    b.innerHTML=cur.posiciones.map((p,i)=>{
      const face=(drawn[i]&&drawn[i].shown)?slotFace(drawn[i]):`<span class="ph">${p.id}</span>`;
      return `<div class="slot ${p.rot?'rot':''} ${selIdx===i?'sel':''}" id="slot${i}" style="left:${p.x}%;top:${p.y}%" onclick="selCarta(${i})"><span class="num">${p.id}</span>${face}</div>`;
    }).join('');
    renderLegend();
  }
  function updateSlot(i){
    const s=document.getElementById('slot'+i); if(!s)return; const p=cur.posiciones[i];
    s.innerHTML=`<span class="num">${p.id}</span>${slotFace(drawn[i])}`;
    renderLegend();
  }
  function renderLegend(){
    document.getElementById('legend').innerHTML=cur.posiciones.map((p,i)=>{
      const d=drawn[i]; const rev=d&&d.shown;
      return `<div class="leg ${selIdx===i?'sel':''}" onclick="selCarta(${i})"><div class="n">${p.id}</div><div><div class="pn">${esc(p.nombre)}</div><div class="cn">${rev?esc(d.carta)+(d.invertida?' (invertida)':''):esc(p.descripcion||'')}</div></div></div>`;
    }).join('');
  }
  function tirar(){
    if(barajeando)return;
    const names=MAZO.map(c=>c.nombre); const pool=[...names]; drawn=[];
    for(let i=0;i<cur.posiciones.length;i++){ const j=Math.floor(Math.random()*pool.length); const carta=pool.splice(j,1)[0]; drawn.push({posicion:cur.posiciones[i].nombre, carta, invertida:Math.random()<0.28, shown:false}); }
    selIdx=-1; picked=0;
    document.getElementById('detail').innerHTML=''; document.getElementById('reading').innerHTML='';
    document.getElementById('readBtn').disabled=true; renderBoard();
    barajear(()=>{ if(modo==='auto') repartirAuto(); else montonesManual(); });
  }
  function barajear(cb){
    barajeando=true; document.getElementById('drawBtn').disabled=true;
    const mesa=document.getElementById('mesa');
    mesa.innerHTML='<div class="mesa-hint">Barajando las cartas…</div><div id="shuffle">'+
      Array.from({length:7}).map((_,k)=>`<div class="cback" style="animation:${k%2?'riffleR':'riffleL'} .7s ease ${(k*0.05).toFixed(2)}s 2 both"></div>`).join('')+'</div>';
    setTimeout(cb,1550);
  }
  function repartirAuto(){
    document.getElementById('mesa').innerHTML='';
    drawn.forEach((d,i)=>setTimeout(()=>{ d.shown=true; updateSlot(i); if(i===drawn.length-1) finTirada(); }, 120+i*240));
  }
  function montonesManual(){
    const mesa=document.getElementById('mesa'); const nm=6;
    mesa.innerHTML=`<div class="mesa-hint" id="mhint">Elige tus cartas — faltan ${drawn.length}</div>`+
      `<div class="montones" id="montones">`+
      Array.from({length:nm}).map((_,k)=>`<div class="monton" data-k="${k}" onclick="elegir(${k})">`+
        Array.from({length:5}).map((_,j)=>`<div class="cback" style="top:${j*1.6}px;left:${j*1.6}px"></div>`).join('')+
        `</div>`).join('')+`</div>`;
  }
  function elegir(k){
    if(picked>=drawn.length)return;
    const i=picked; const d=drawn[i];
    const monton=document.querySelector('.monton[data-k="'+k+'"]'); const toEl=document.getElementById('slot'+i);
    if(!monton||!toEl)return;
    const backs=monton.querySelectorAll('.cback'); if(backs.length) backs[backs.length-1].remove();
    if(!monton.querySelectorAll('.cback').length) monton.classList.add('vacio');
    volar(monton,toEl,()=>{
      d.shown=true; updateSlot(i); picked++;
      if(picked>=drawn.length){ document.getElementById('mesa').innerHTML=''; finTirada(); selCarta(0); }
      else { const h=document.getElementById('mhint'); if(h)h.textContent='Elige tus cartas — faltan '+(drawn.length-picked); }
    });
  }
  function volar(fromEl,toEl,cb){
    const fr=fromEl.getBoundingClientRect(), tr=toEl.getBoundingClientRect();
    const w=62,h=100;
    const fly=document.createElement('div'); fly.className='flyer cback';
    fly.style.width=w+'px'; fly.style.height=h+'px';
    fly.style.left=(fr.left+fr.width/2-w/2)+'px'; fly.style.top=(fr.top)+'px';
    document.body.appendChild(fly);
    const dx=(tr.left+tr.width/2)-(fr.left+fr.width/2);
    const dy=(tr.top+tr.height/2)-(fr.top+h/2);
    requestAnimationFrame(()=>{ fly.style.transform=`translate(${dx}px,${dy}px) scale(${Math.max(.4,tr.width/w)})`; });
    setTimeout(()=>{ fly.remove(); cb&&cb(); },640);
  }
  function finTirada(){
    barajeando=false; document.getElementById('drawBtn').disabled=false;
    document.getElementById('readBtn').disabled=false; renderLegend();
  }
  function selCarta(i){ selIdx=i;
    document.querySelectorAll('#board .slot').forEach((s,k)=>s.classList.toggle('sel',k===i));
    const p=cur.posiciones[i]; const d=drawn[i]; const det=document.getElementById('detail');
    document.querySelectorAll('#legend .leg').forEach((s,k)=>s.classList.toggle('sel',k===i));
    if(!d||!d.shown){ det.innerHTML=`<h3>${esc(p.nombre)}</h3><div class="pos">${esc(p.descripcion||'')}</div><p style="color:var(--muted);font-size:.85rem">Baraja y elige para revelar esta carta.</p>`; return; }
    const c=MBYNAME[d.carta]||{};
    det.innerHTML=`<h3>${esc(d.carta)}${d.invertida?' <span style="font-size:.8rem;color:var(--muted)">(invertida)</span>':''}</h3><div class="pos">Posición ${p.id}: ${esc(p.nombre)} — ${esc(p.descripcion||'')}</div>
      ${c.palabras_clave&&c.palabras_clave.length?`<div class="mb-sec">Palabras clave</div><div class="kw">${c.palabras_clave.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}
      ${c.sombra&&c.sombra.length?`<div class="mb-sec">Sombra</div><div class="kw">${c.sombra.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}
      ${c.pregunta_terapeutica?`<div class="mb-sec">Pregunta terapéutica</div><p style="font-size:.86rem">${esc(c.pregunta_terapeutica)}</p>`:''}`;
  }
  async function leerTirada(){
    if(!drawn.length)return; const btn=document.getElementById('readBtn'); btn.disabled=true; const t0=btn.textContent; btn.textContent='Leyendo…';
    const r=document.getElementById('reading'); r.innerHTML='<div class="loading">Interpretando la tirada…</div>';
    try{
      const res=await fetch('/tarot/lectura',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pregunta:(document.getElementById('preg').value.trim()||'Lectura general'),tirada:cur._id,cartas:drawn.map(d=>({posicion:d.posicion,carta:d.carta,invertida:d.invertida})),profundidad:'estandar',enfoque:cur.enfoque||'terapeutico',sistema:DECK})});
      const d=await res.json(); r.innerHTML=md(d&&d.lectura?d.lectura:'No se pudo generar la lectura.');
    }catch(e){ r.innerHTML='<p style="color:#dc2626">Error de conexión.</p>'; }
    btn.disabled=false; btn.textContent=t0;
  }
  function renderCartas(){
    const q=norm((document.getElementById('qCar')||{}).value||'');
    let res=MAZO; if(q) res=res.filter(c=>norm(c.nombre+' '+c.grupo+' '+(c.palabras_clave||[]).join(' ')).includes(q));
    document.getElementById('cntCar').textContent=res.length+' cartas';
    document.getElementById('gridCar').innerHTML=res.map(c=>`<div class="card" onclick="verCarta(${JSON.stringify(c.nombre).replace(/"/g,'&quot;')})"><img src="${IMG[c.nombre]||''}" onerror="this.style.opacity=.15" alt=""><div class="cb"><div class="cn">${esc(c.nombre)}</div><div class="cg">${esc(c.grupo)}</div></div></div>`).join('');
  }
  function verCarta(nombre){ const c=MBYNAME[nombre]; if(!c)return;
    document.getElementById('modalBox').innerHTML=`<img src="${IMG[c.nombre]||''}" onerror="this.style.opacity=.15" alt=""><div class="modal-c"><h2>${esc(c.nombre)}</h2><div class="g">${esc(c.grupo)}${c.elemento?' · '+esc(c.elemento):''}${c.arquetipo?' · '+esc(c.arquetipo):''}</div>
    ${c.palabras_clave&&c.palabras_clave.length?`<div class="mb-sec">Palabras clave</div><div class="kw">${c.palabras_clave.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}
    ${c.sombra&&c.sombra.length?`<div class="mb-sec">Sombra</div><div class="kw">${c.sombra.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}
    ${c.pregunta_terapeutica?`<div class="mb-sec">Pregunta terapéutica</div><p style="font-size:.88rem">${esc(c.pregunta_terapeutica)}</p>`:''}
    ${c.afirmacion?`<div class="mb-sec">Afirmación</div><p style="font-size:.88rem">${esc(c.afirmacion)}</p>`:''}</div>`;
    document.getElementById('modal').classList.add('open');
  }
  function cerrarCarta(){ document.getElementById('modal').classList.remove('open'); }
  document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarCarta()});
  async function consultaRapida(){
    const q=document.getElementById('cPreg').value.trim(); if(!q){alert('Escribe tu pregunta.');return;}
    const btn=document.getElementById('cBtn'); btn.disabled=true; const t0=btn.textContent; btn.textContent='Consultando…';
    const names=MAZO.map(c=>c.nombre); const pool=[...names]; const pos=['Pasado','Presente','Futuro / Potencial']; const cs=[];
    for(let i=0;i<3;i++){ const j=Math.floor(Math.random()*pool.length); cs.push({posicion:pos[i],carta:pool.splice(j,1)[0],invertida:Math.random()<0.28}); }
    document.getElementById('cBoard').innerHTML='<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px">'+cs.map(c=>`<div style="text-align:center"><img src="${IMG[c.carta]||''}" style="width:96px;aspect-ratio:130/214;object-fit:cover;border-radius:8px;${c.invertida?'transform:rotate(180deg)':''}" onerror="this.style.opacity=.15"><div style="font-size:.72rem;color:var(--muted);margin-top:5px">${esc(c.posicion)}</div><div style="font-size:.76rem;font-weight:700">${esc(c.carta)}</div></div>`).join('')+'</div>';
    const r=document.getElementById('cReading'); r.innerHTML='<div class="loading">Interpretando…</div>';
    try{ const res=await fetch('/tarot/lectura',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pregunta:q,tirada:'tres_cartas',cartas:cs,profundidad:'estandar',enfoque:'terapeutico',sistema:DECK})});
      const d=await res.json(); r.innerHTML=md(d&&d.lectura?d.lectura:'No se pudo generar la lectura.'); }catch(e){ r.innerHTML='<p style="color:#dc2626">Error de conexión.</p>'; }
    btn.disabled=false; btn.textContent=t0;
  }
  function md(t){const e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');let h='',il=false;const cl=()=>{if(il){h+='</ul>';il=false}};for(let l of (t||'').split('\n')){if(/^#{1,3} /.test(l)){cl();const lv=l.match(/^#+/)[0].length;const tag=lv<3?'h2':'h3';h+=`<${tag}>${e(l.replace(/^#+ /,''))}</${tag}>`;continue}if(/^[-*•] /.test(l)){if(!il){h+='<ul>';il=true}h+=`<li>${inl(e(l.replace(/^[-*•] /,'')))}</li>`;continue}cl();h+=l.trim()===''?'':`<p>${inl(e(l))}</p>`}cl();return h}
  cargar();
</script></body></html>
