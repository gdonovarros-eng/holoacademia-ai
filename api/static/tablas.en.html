<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Table Scanning · Holistic Copilot</title><style>
:root{
  --bg:#0e0e12;--surface:#16161e;--card:#1e1e2a;--border:#2a2a3a;
  --accent:#8b5cf6;--accent2:#8b5cf6;--green:#8b5cf6;--red:#ec4899;
  --yellow:#f9a8d4;--orange:#f472b6;
  --text:#e8e8f0;--muted:#8b5cf6;--tag-bg:#252535;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
.app-header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.app-header a{color:var(--muted);text-decoration:none;font-size:1.2rem;padding:4px 8px;border-radius:6px;transition:color .2s}
.app-header a:hover{color:var(--text)}
.app-header h1{font-size:1rem;font-weight:600;letter-spacing:.03em}
.app-header span{color:var(--muted);font-size:.8rem}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.stat-pill{background:var(--tag-bg);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:.75rem;color:var(--muted)}
.stat-pill b{color:var(--text)}

/* LAYOUT */
.main-layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 55px)}
.sidebar{width:220px;min-width:180px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow-y:auto}
.content-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.confirmed-panel{width:300px;min-width:240px;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column}

/* SIDEBAR */
.sidebar-section{padding:10px 0}
.sidebar-label{font-size:.65rem;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:4px 14px 8px}
.cat-btn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 14px;background:none;border:none;color:var(--muted);font-size:.8rem;cursor:pointer;text-align:left;transition:all .15s;border-left:2px solid transparent}
.cat-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}
.cat-btn.active{color:var(--accent);background:rgba(139, 92, 246,.08);border-left-color:var(--accent)}
.cat-count{margin-left:auto;background:var(--tag-bg);border-radius:10px;padding:1px 7px;font-size:.68rem;color:var(--muted)}
.cat-btn.active .cat-count{color:var(--accent)}

.tipo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-bacteria{background:#ec4899}
.dot-virus{background:#f472b6}
.dot-hongo{background:#f9a8d4}
.dot-parasito{background:#8b5cf6}
.dot-emocional{background:#8b5cf6}
.dot-disfuncional{background:#8b5cf6}
.dot-especial{background:#f472b6}
.dot-reservorio{background:#c4b5fd}
.dot-desconocido{background:#8b5cf6}
.dot-sales{background:#f9a8d4}
.dot-bach{background:#c4b5fd}
.dot-vitaminas{background:#c4b5fd}
.dot-creencias{background:#a78bfa}
.dot-conflicto{background:#f9a8d4}
.dot-homeopatico{background:#ddd6fe}
.dot-chakra{background:#f9a8d4}
.dot-elementos{background:#ddd6fe}
.dot-aminoacidos{background:#fbcfe8}
.dot-enzimas{background:#ddd6fe}
.dot-miedos{background:#c4b5fd}

/* SISTEMA FILTER */
.sis-filter{padding:10px 14px}
.sis-filter label{font-size:.7rem;color:var(--muted);display:block;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sis-filter select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:.78rem}
.sis-filter select:focus{outline:none;border-color:var(--accent)}

/* SEARCH */
.search-bar{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.search-bar input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:.85rem}
.search-bar input:focus{outline:none;border-color:var(--accent)}

/* TABLE AREA */
.table-scroll{flex:1;overflow-y:auto;padding:12px 16px}
.table-scroll::-webkit-scrollbar{width:4px}
.table-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.category-title{font-size:1rem;font-weight:700;margin-bottom:4px;color:var(--text)}
.category-sub{font-size:.75rem;color:var(--muted);margin-bottom:12px}

.items-grid{display:flex;flex-direction:column;gap:6px}
.item-row{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:all .15s}
.item-row:hover{border-color:var(--accent);background:rgba(139, 92, 246,.06)}
.item-row.checked{border-color:var(--green);background:rgba(139, 92, 246,.08)}
.item-cb{width:16px;height:16px;accent-color:var(--green);cursor:pointer;margin-top:2px;flex-shrink:0}
.item-body{flex:1;min-width:0}
.item-nombre{font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:3px}
.item-condiciones{font-size:.75rem;color:var(--muted);line-height:1.45;margin-bottom:3px}
.item-emocional{font-size:.72rem;color:#c4b5fd;font-style:italic;line-height:1.4}
.item-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:.62rem;padding:2px 7px;border-radius:10px;background:var(--tag-bg);color:var(--muted)}
.tag-tipo{text-transform:capitalize}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state svg{opacity:.3;margin-bottom:12px}
.empty-state p{font-size:.85rem}

/* CONFIRMED PANEL */
.confirmed-panel .panel-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.confirmed-panel .panel-header h3{font-size:.85rem;font-weight:700;color:var(--text)}
.conf-count{background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;font-size:.72rem;font-weight:700}
.confirmed-scroll{flex:1;overflow-y:auto;padding:10px}
.confirmed-scroll::-webkit-scrollbar{width:4px}
.confirmed-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.conf-item{background:var(--card);border:1px solid var(--green);border-radius:7px;padding:8px 10px;margin-bottom:6px;display:flex;gap:8px;align-items:flex-start}
.conf-item-body{flex:1;min-width:0}
.conf-nombre{font-size:.78rem;font-weight:600;margin-bottom:2px}
.conf-sub{font-size:.68rem;color:var(--muted);line-height:1.4}
.conf-remove{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:4px;font-size:.75rem;flex-shrink:0;transition:color .15s}
.conf-remove:hover{color:var(--red)}
.conf-empty{text-align:center;padding:40px 14px;color:var(--muted);font-size:.78rem;line-height:1.6}

.panel-actions{padding:10px 12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.btn-copy{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px;font-size:.8rem;font-weight:600;cursor:pointer;width:100%;transition:opacity .15s}
.btn-copy:hover{opacity:.85}
.btn-clear{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px;font-size:.75rem;cursor:pointer;width:100%;transition:all .15s}
.btn-clear:hover{border-color:var(--red);color:var(--red)}

/* LOADING */
.loading{text-align:center;padding:60px;color:var(--muted);font-size:.85rem}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Static table styles (Schüssler, Bach, Vitaminas, Creencias) */
.static-table{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:8px}
.static-table th{background:var(--tag-bg);color:var(--muted);font-weight:600;padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
.static-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top;line-height:1.4}
.static-table tr:hover td{background:rgba(255,255,255,.03)}
.static-table tr.checked-row td{background:rgba(139, 92, 246,.07)}
.num-cell{color:var(--muted);width:36px;font-size:.7rem}
.nombre-cell{font-weight:600;color:var(--text);min-width:140px}
.desc-cell{color:var(--muted)}
.emoc-cell{color:#c4b5fd;font-style:italic}
.cb-cell{width:32px;text-align:center}
.cb-cell input[type=checkbox]{accent-color:var(--green);width:14px;height:14px;cursor:pointer}

/* Group headers inside static tables */
.group-header{background:rgba(139, 92, 246,.1);color:var(--accent);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px}

@media(max-width:900px){
  .confirmed-panel{display:none}
}
@media(max-width:640px){
  .sidebar{width:160px}
}

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  // Load pairs DB
 try {
 const r = await fetch('/api/pares-db');
 const d = await r.json();
 ALL_PAIRS = d.pairs || [];
 const tipoMap = {};
 for (const p of ALL_PAIRS) {
 tipoMap[p.tipo] = (tipoMap[p.tipo] || 0) + 1;
    }
 for (const [tipo, cnt] of Object.entries(tipoMap)) {
 const el = document.getElementById('cnt-' + tipo);
 if (el) el.textContent = cnt;
    }
  } catch(e) {
 ALL_PAIRS = [];
  }

  // Load conflictología DB
 try {
 const r = await fetch('/api/conflictologia-db');
 const d = await r.json();
 CONFLICTO_DB = d.systems || {};
    // Set counts
 const sysMap = {
 respiratorio: 'respiratorio', digestivo: 'digestivo',
 cardiovascular: 'cardiovascular', locomotor: 'locomotor',
 genital: 'genital', urinario: 'urinario', endocrino: 'endocrino',
 inmunologico: 'inmunologico', piel: 'piel', neurosensorial: 'neurosensorial'
    };
 for (const [key, slug] of Object.entries(sysMap)) {
 const sys = CONFLICTO_DB[key];
 if (!sys) continue;
 const total = Object.values(sys.subsystems).reduce((s, sub) =>s + sub.conflicts.length, 0);
 const el = document.getElementById('cnt-conf-' + slug);
 if (el) el.textContent = total;
    }
  } catch(e) {
 CONFLICTO_DB = {};
  }

 renderCurrent();
}

// ─── Category selection ───────────────────────────────────────────────────────
function selectCat(btn) {
 document.querySelectorAll('.cat-btn').forEach(b =>b.classList.remove('active'));
 btn.classList.add('active');
 currentCat = btn.dataset.cat;
 document.getElementById('searchBox').value = '';
 document.getElementById('sisFilter').value = '';
 renderCurrent();
}

function renderCurrent() {
 const staticCats = ['sales','bach','vitaminas','creencias','miedos',
    'policrestos','semipolicrestos','chakras_primarios','chakras_secundarios',
    'cinco_elementos','aminoacidos','enzimas'];
 if (currentCat.startsWith('conflicto_')) {
 renderConflictologia(currentCat.replace('conflicto_', ''));
  } else if (staticCats.includes(currentCat)) {
 renderStatic(currentCat);
  } else {
 renderPairs(currentCat);
  }
}

// ─── Conflictología rendering ─────────────────────────────────────────────────
function renderConflictologia(sysKey) {
 document.getElementById('sisFilter').value = '';
 const query = (document.getElementById('searchBox').value || '').toLowerCase();
 const sys = CONFLICTO_DB[sysKey];

 const sysLabels = {
 respiratorio:'Respiratory System', digestivo:'Digestive System',
 cardiovascular:'Cardiovascular System', locomotor:'Locomotor / Musculoskeletal System',
 genital:'Reproductive System', urinario:'Urinary / Renal System',
 endocrino:'Endocrine-Metabolic System', inmunologico:'Immune / Lymphatic System',
 piel:'Lipofascial / Dermatological System', neurosensorial:'Neurosensory System'
  };

 const title = sysLabels[sysKey] || sysKey;
 document.getElementById('categoryLabel').textContent = title;
 const scroll = document.getElementById('tableScroll');

 if (!sys || !sys.subsystems || Object.keys(sys.subsystems).length === 0) {
 scroll.innerHTML = `<div class="empty-state"><p>No conflictology data for this system.</p></div>`;
 return;
  }

 let total = Object.values(sys.subsystems).reduce((s, sub) =>s + sub.conflicts.length, 0);

 let html = `<div class="category-title" style="color:#f9a8d4">${escHtml(title)}</div><div class="category-sub">Psychosomatic conflictology — ${total} conflicts in ${Object.keys(sys.subsystems).length} subsystems</div>`;

 for (const [slug, sub] of Object.entries(sys.subsystems)) {
    // Filter by query
 let conflicts = sub.conflicts;
 if (query) {
 conflicts = conflicts.filter(c =>c.nombre.toLowerCase().includes(query) ||
        (c.desc || '').toLowerCase().includes(query)
      );
 if (!conflicts.length) continue;
    }

 html += `<div style="margin-bottom:16px"><div style="font-size:.7rem;font-weight:700;color:#f9a8d4;text-transform:uppercase;letter-spacing:.07em;padding:8px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px">
        ${escHtml(sub.label)} <span style="color:var(--muted);font-weight:400;text-transform:none">(${conflicts.length})</span></div><div class="items-grid">`;

 for (const c of conflicts) {
 const cid = 'conf_' + sysKey + '_' + btoa(encodeURIComponent(c.nombre)).replace(/[^a-z0-9]/gi,'').slice(0,16);
 const isChk = confirmed.some(x =>x.id === cid);
 const hasDesc = c.desc && c.desc !== c.nombre;
 html += `<div class="item-row ${isChk?'checked':''}" onclick="toggleConflicto('${cid}','${escHtml(c.nombre).replace(/'/g,"\\'")}','${sysKey}','${escHtml(sub.label).replace(/'/g,"\\'")}')"><input type="checkbox" class="item-cb" ${isChk?'checked':''} onclick="event.stopPropagation();toggleConflicto('${cid}','${escHtml(c.nombre).replace(/'/g,"\\'")}','${sysKey}','${escHtml(sub.label).replace(/'/g,"\\'")}')"/><div class="item-body"><div class="item-nombre">${escHtml(c.nombre)}</div>
          ${hasDesc?`<div class="item-condiciones" style="color:#c4b5fd;font-style:italic">${escHtml(c.desc)}</div>`:''}
 </div></div>`;
    }
 html += `</div></div>`;
  }

 scroll.innerHTML = html;
}

function toggleConflicto(id, nombre, sysKey, subLabel) {
 const idx = confirmed.findIndex(c =>c.id === id);
 if (idx >= 0) {
 confirmed.splice(idx, 1);
  } else {
 confirmed.push({ id, nombre, tipo: 'conflicto', cat: sysKey, sub: subLabel });
  }
 renderCurrent();
 renderConfirmed();
}

 for (const p of pairs) {

function togglePair(id) {
 const pair = ALL_PAIRS.find(p =>p.id === id);

 confirmed.splice(idx, 1);

 confirmed.push({
 id: pair.id,
 nombre: pair.nombre,
 tipo: pair.tipo,
 cat: currentCat,
 sub: pair.sistemas_afectados ? pair.sistemas_afectados.join(', ') : ''
    });
  }
 renderCurrent();
 renderConfirmed();
}

 const chk = confirmed.some(c =>c.id === id);
 html += `<div class="item-row ${chk?'checked':''}" onclick="toggleStatic('${id}','${escHtml(ck.nombre)}','chakras_primarios','Primary Chakras')" style="border-left:3px solid ${ck.color}"><input type="checkbox" class="item-cb" ${chk?'checked':''} onclick="event.stopPropagation();toggleStatic('${id}','${escHtml(ck.nombre)}','chakras_primarios','Primary Chakras')"/><div class="item-body"><div class="item-nombre">${ck.n}. ${escHtml(ck.nombre)}</div><div class="item-condiciones"> ${escHtml(ck.elemento)} ·  ${escHtml(ck.color)} ·  ${escHtml(ck.glandula)}</div><div class="item-condiciones">Aspect: ${escHtml(ck.aspecto)}</div><div class="item-condiciones">Organs: ${escHtml(ck.organos)}</div><div class="item-emocional"> ${escHtml(ck.emoc)}</div></div></div>`;
    }
 scroll.innerHTML = html;
  }

 else if (cat === 'chakras_secundarios') {
 let data = CHAKRAS_SECUNDARIOS;
 if (query) data = data.filter(c =>c.nombre.toLowerCase().includes(query) ||
 c.desc.toLowerCase().includes(query)
    );
 let html = `<div class="category-title" style="color:#f9a8d4">Secondary Chakras (21)</div><div class="category-sub">Mini-chakras — HoloBiomagnetism bioenergetic system</div><table class="static-table"><thead><tr><th style="width:48px">#</th><th class="nombre-cell">Energy center</th><th class="desc-cell">Meaning and function</th><th class="cb-cell"></th></tr></thead><tbody>`;
 for (const ck of data) {
 const id = 'cks_' + ck.n.toString().replace(/[^a-z0-9]/gi,'');
 const chk = confirmed.some(c =>c.id === id);
 html += `<tr class="${chk?'checked-row':''}" onclick="toggleStatic('${id}','${escHtml(ck.nombre)}','chakras_secundarios','Secondary Chakras')"><td class="num-cell">${ck.n}</td><td class="nombre-cell">${escHtml(ck.nombre)}</td><td class="desc-cell">${escHtml(ck.desc)}</td><td class="cb-cell"><input type="checkbox" ${chk?'checked':''} onclick="event.stopPropagation();toggleStatic('${id}','${escHtml(ck.nombre)}','chakras_secundarios','Secondary Chakras')"/></td></tr>`;
    }
 html += '</tbody></table>';
 scroll.innerHTML = html;
  }

 else if (cat === 'cinco_elementos') {
 let data = CINCO_ELEMENTOS;
 if (query) data = data.filter(e =>e.nombre.toLowerCase().includes(query) ||
 e.organos_yin.toLowerCase().includes(query) ||
 e.emocion_neg.toLowerCase().includes(query) ||
 e.emocion_pos.toLowerCase().includes(query)
    );
 let html = `<div class="category-title" style="color:#ddd6fe">5 Elements (TCM / HoloBiomagnetism)</div><div class="category-sub">Chinese energy philosophy (Neijing) — bioenergetic diagnostic system</div>`;
 for (const el of data) {
 const id = '5el_' + el.n;
 const chk = confirmed.some(c =>c.id === id);
 html += `<div class="item-row ${chk?'checked':''}" onclick="toggleStatic('${id}','${escHtml(el.nombre)}','cinco_elementos','5 Elements')" style="border-left:3px solid ${el.color}"><input type="checkbox" class="item-cb" ${chk?'checked':''} onclick="event.stopPropagation();toggleStatic('${id}','${escHtml(el.nombre)}','cinco_elementos','5 Elements')"/><div class="item-body"><div class="item-nombre" style="color:${el.color};font-size:.95rem">${escHtml(el.nombre)}</div><div class="item-condiciones">Yin: <b>${escHtml(el.organos_yin)}</b> · Yang: <b>${escHtml(el.organos_yang)}</b></div><div class="item-condiciones">Season: ${escHtml(el.estacion)} · Flavor: ${escHtml(el.sabor)} · Tissue: ${escHtml(el.tejido)}</div><div class="item-emocional"> ${escHtml(el.emocion_neg)}</div><div class="item-emocional" style="color:#c4b5fd"> ${escHtml(el.emocion_pos)}</div></div></div>`;
    }
 scroll.innerHTML = html;
  }

 else if (cat === 'aminoacidos') {
 let data = AMINOACIDOS;
 if (query) data = data.filter(a =>a.nombre.toLowerCase().includes(query) || a.desc.toLowerCase().includes(query) || a.cat.toLowerCase().includes(query));
 const groups = [...new Set(AMINOACIDOS.map(a=>a.cat))];
 let html = `<div class="category-title" style="color:#fbcfe8">Amino Acids</div><div class="category-sub">${AMINOACIDOS.length} amino acids — deficiency scanning</div><table class="static-table"><thead><tr><th class="num-cell">#</th><th class="nombre-cell">Amino acid</th><th class="desc-cell">Main function</th><th class="cb-cell"></th></tr></thead><tbody>`;
 for (const g of groups) {
 const gItems = data.filter(a=>a.cat===g);
 if (!gItems.length) continue;
 html += `<tr><td colspan="4" class="group-header">${g}</td></tr>`;
 for (const a of gItems) {
 const id = 'aa_' + a.n;
 const chk = confirmed.some(c =>c.id === id);
 html += `<tr class="${chk?'checked-row':''}" onclick="toggleStatic('${id}','${escHtml(a.nombre)}','aminoacidos','Amino Acids')"><td class="num-cell">${a.n}</td><td class="nombre-cell">${escHtml(a.nombre)}</td><td class="desc-cell">${escHtml(a.desc)}</td><td class="cb-cell"><input type="checkbox" ${chk?'checked':''} onclick="event.stopPropagation();toggleStatic('${id}','${escHtml(a.nombre)}','aminoacidos','Amino Acids')"/></td></tr>`;
      }
    }
 html += '</tbody></table>';
 scroll.innerHTML = html;
  }

 else if (cat === 'enzimas') {
 let data = ENZIMAS;
 if (query) data = data.filter(e =>e.nombre.toLowerCase().includes(query) || e.desc.toLowerCase().includes(query) || e.cat.toLowerCase().includes(query));
 const groups = [...new Set(ENZIMAS.map(e=>e.cat))];
 let html = `<div class="category-title" style="color:#ddd6fe">Enzymes</div><div class="category-sub">${ENZIMAS.length} enzymes — enzyme activity scanning</div><table class="static-table"><thead><tr><th class="num-cell">#</th><th class="nombre-cell">Enzyme</th><th class="desc-cell">Function / Clinical significance</th><th class="cb-cell"></th></tr></thead><tbody>`;
 for (const g of groups) {
 const gItems = data.filter(e=>e.cat===g);
 if (!gItems.length) continue;
 html += `<tr><td colspan="4" class="group-header">${g}</td></tr>`;
 for (const e of gItems) {
 const id = 'enz_' + e.n;
 const chk = confirmed.some(c =>c.id === id);
 html += `<tr class="${chk?'checked-row':''}" onclick="toggleStatic('${id}','${escHtml(e.nombre)}','enzimas','Enzymes')"><td class="num-cell">${e.n}</td><td class="nombre-cell">${escHtml(e.nombre)}</td><td class="desc-cell">${escHtml(e.desc)}</td><td class="cb-cell"><input type="checkbox" ${chk?'checked':''} onclick="event.stopPropagation();toggleStatic('${id}','${escHtml(e.nombre)}','enzimas','Enzymes')"/></td></tr>`;
      }
    }
 html += '</tbody></table>';
 scroll.innerHTML = html;
  }
}

function toggleStatic(id, nombre, cat, catLabel) {
 const idx = confirmed.findIndex(c =>c.id === id);
 if (idx >= 0) {
 confirmed.splice(idx, 1);
  } else {
 confirmed.push({ id, nombre, tipo: cat, cat, sub: catLabel });
  }
 renderCurrent();
 renderConfirmed();
}

// ─── Confirmed panel ──────────────────────────────────────────────────────────
function renderConfirmed() {
 const scroll = document.getElementById('confirmedScroll');
 const cnt = document.getElementById('confCount');
 const total = document.getElementById('totalConf');
 cnt.textContent = confirmed.length;
 total.textContent = confirmed.length;

 if (!confirmed.length) {
 scroll.innerHTML = '<div class="conf-empty">Check items in the table to add them here.</div>';
 return;
  }

  // Group by cat
 const groups = {};
 for (const c of confirmed) {
 const g = c.sub || c.cat || 'Otros';
 if (!groups[g]) groups[g] = [];
 groups[g].push(c);
  }

 let html = '';
 for (const [g, items] of Object.entries(groups)) {
 html += `<div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:6px 0 4px;font-weight:700">${escHtml(g)}</div>`;
 for (const item of items) {
 html += `<div class="conf-item"><div class="conf-item-body"><div class="conf-nombre">${escHtml(item.nombre)}</div></div><button class="conf-remove" onclick="removeConfirmed('${item.id.replace(/'/g,"\\'")}')"></button></div>`;
    }
  }
 scroll.innerHTML = html;
}

function removeConfirmed(id) {
 confirmed = confirmed.filter(c =>c.id !== id);
 renderCurrent();
 renderConfirmed();
}

function limpiarTodo() {
 if (!confirmed.length) return;
 if (confirm(`Clear the ${confirmed.length} selected items?`)) {
 confirmed = [];
 renderCurrent();
 renderConfirmed();
  }
}

function copiarConfirmados() {
 if (!confirmed.length) { alert('No items selected.'); return; }

 const groups = {};
 for (const c of confirmed) {
 const g = c.sub || c.cat || 'Otros';
 if (!groups[g]) groups[g] = [];
 groups[g].push(c);
  }

 let text = ' CONFIRMED SCAN\n';
 text += '━'.repeat(30) + '\n\n';
 for (const [g, items] of Object.entries(groups)) {
 text += `▸ ${g.toUpperCase()}\n`;
 for (const item of items) {
 text += `  • ${item.nombre}\n`;
    }
 text += '\n';
  }
 text += `Total: ${confirmed.length} item${confirmed.length!==1?'s':''}`;

 navigator.clipboard.writeText(text).then(() => {
 const btn = document.querySelector('.btn-copy');
 btn.textContent = ' Copied!';
 setTimeout(() =>btn.textContent = ' Copy list', 2000);
  });
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function escHtml(s) {
 if (!s) return '';
 return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
init();
</script></body></html>
