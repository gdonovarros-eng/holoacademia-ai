<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos — Holoacademia</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; background: #F5F3FF; }
  section { padding: 96px 5%; background: #F5F3FF; }
  .inner { max-width: 1200px; margin: 0 auto; }
  .center { text-align: center; margin-bottom: 64px; }
  .tag { font-size: 12px; font-weight: 700; color: #7C3AED; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
  h2 { font-size: clamp(1.8rem, 3vw, 2.5rem); font-weight: 900; color: #111827; letter-spacing: -1px; margin-bottom: 16px; line-height: 1.15; }
  .sub { font-size: 16px; color: #6B7280; max-width: 520px; margin: 0 auto; line-height: 1.65; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
  .row2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 820px; margin: 0 auto; }
  .card { border-radius: 20px; border: 1.5px solid transparent; background: #fff; padding: 28px 24px 24px; transition: all 0.25s; display: flex; flex-direction: column; box-shadow: 0 2px 12px rgba(0,0,0,0.04); opacity: 0; transform: translateY(40px); }
  .card.visible { opacity: 1; transform: none; }
  .card:hover { transform: translateY(-4px); }
  .card-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
  .icon-box { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .card-title { font-weight: 800; font-size: 15px; color: #111827; line-height: 1.3; margin-bottom: 4px; }
  .count-badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; }
  .desc { font-size: 13px; color: #6B7280; line-height: 1.6; margin-bottom: 18px; }
  .course-list { border-top: 1px solid rgba(0,0,0,0.06); padding-top: 16px; flex: 1; }
  .course-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 7px; font-size: 12.5px; color: #374151; line-height: 1.4; }
  .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; opacity: 0.6; }
  .cta-wrap { text-align: center; margin-top: 48px; }
  .cta-btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 32px; border-radius: 10px; background: #7C3AED; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; transition: all 0.2s; box-shadow: 0 4px 16px rgba(124,58,237,0.3); }
  .cta-btn:hover { background: #5B21B6; transform: translateY(-2px); }
  @media (max-width: 900px) { .row3 { grid-template-columns: repeat(2, 1fr); } .row2 { grid-template-columns: 1fr; max-width: 100%; } }
  @media (max-width: 520px) { .row3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<section>
  <div class="inner">
    <div class="center">
      <div class="tag">Formación</div>
      <h2>5 líneas de estudio.<br>+75 cursos. Todo en un lugar.</h2>
      <p class="sub">Cada línea tiene su secuencia de aprendizaje sugerida. El Motor IA te guía en tiempo real mientras aplicas lo que estudias.</p>
    </div>
    <div class="row3" id="row3"></div>
    <div class="row2" id="row2"></div>
    <div class="cta-wrap">
      <a href="https://www.holoacademia.com/programas" target="_blank" class="cta-btn">Ver todos los cursos →</a>
    </div>
  </div>
</section>
<script>
const LINES = [
  { emoji: '🩺', name: 'Línea de Salud', color: '#7C3AED', colorLight: '#F5F3FF', count: 30,
    desc: 'El corazón de la formación terapéutica. Desde biomagnetismo hasta medicina energética.',
    courses: ['Biomagnetismo Básico V1 y V2','Biomagnetismo de la A a la Z V1 y V2','Holobiomagnetismo V1 y V2','Holopsicosomática V1 y V2','Medicina Tradicional China 1 y 2','Sanación Transgeneracional 1–4','Herbolaria Mágica y Medicinal V1 y V2','Flores de Bach · Bioelectromagnetismo','Terapia Sistémica · Sanación Emocional','Elíxires Aztecas · Farmacia Viviente'] },
  { emoji: '🎓', name: 'Diplomados SEP', color: '#D97706', colorLight: '#FFFBEB', count: 13,
    desc: 'Certificaciones de 120 hrs con aval oficial. El nivel más alto de formación en Holoacademia.',
    courses: ['Diplomado Biomagnetismo Médico Integral','Diplomado Medicina Tradicional China','Diplomado Acupuntura: El arte de aliviar el dolor','Diplomado Transgeneracional','Diplomado Ancestros y Raíces','Diplomado Sanación Energética Integral','Diplomado Fitoterapia','Diplomado Nutrición Terapéutica','Diplomado Práctica Mística 1 y 2','Diplomado Tarot · Diplomado Masoterapia'] },
  { emoji: '🔮', name: 'Línea Mística', color: '#6D28D9', colorLight: '#EDE9FE', count: 14,
    desc: 'Desarrollo espiritual, magia, tarot y herramientas de percepción energética.',
    courses: ['Iniciación a la Magia V1 y V2','Numerología · Numerología Avanzada','Tarot 1 · Tarothología 1, 2 y 3','Radiestesia','Magia y Runas Nórdicas · Alta Magia','Botánica Mágica y Astrológica','Interpretación de Sueños','Liderazgo Sagrado · Retiro Místico'] },
  { emoji: '💼', name: 'Línea Profesional', color: '#059669', colorLight: '#ECFDF5', count: 14,
    desc: 'Mentalidad, propósito, finanzas y habilidades para construir una práctica próspera.',
    courses: ['Un Año con Propósito','Cómo Encontrar tu Propósito','Holobiosophia','Remodela tu Mente y tus Finanzas','El Dinero, Mis Finanzas y Mis Creencias','Salud Financiera','Lectura Rápida y Ultra Rápida','Oratoria y Presencia Escénica','Conociendo Mi Verdadero Yo','Cerrando Ciclos, Abriendo Puertas'] },
  { emoji: '🌿', name: 'Wellness y Bienestar', color: '#0891B2', colorLight: '#ECFEFF', count: 16,
    desc: 'Cuidado del cuerpo, cosmética natural, agricultura urbana y bienestar integral.',
    courses: ['Cosmética Natural V1 y V2','Herbolaria Mágica','Agricultura Urbana 1 y 2','Armonía Corporal','Flores Comestibles','Biorreguladores de la Energía Corporal','Maquillaje Natural · Productos de Higiene Natural','Taller de Perfumes y Fermentos','Botánica para la Diosa Interior','Energía Sexual Sagrada'] },
];

function makeCard(line, delay) {
  const coursesHtml = line.courses.map(c => `<div class="course-item"><span class="dot" style="background:${line.color}"></span>${c}</div>`).join('');
  return `<div class="card" style="border-color:${line.color}22;transition-delay:${delay}s"
    onmouseenter="this.style.borderColor='${line.color}66';this.style.boxShadow='0 16px 40px ${line.color}18'"
    onmouseleave="this.style.borderColor='${line.color}22';this.style.boxShadow='0 2px 12px rgba(0,0,0,0.04)'">
    <div class="card-header">
      <div class="icon-box" style="background:${line.colorLight}">${line.emoji}</div>
      <div>
        <div class="card-title">${line.name}</div>
        <div class="count-badge" style="background:${line.colorLight};color:${line.color}">${line.count} cursos</div>
      </div>
    </div>
    <p class="desc">${line.desc}</p>
    <div class="course-list">${coursesHtml}</div>
  </div>`;
}

document.getElementById('row3').innerHTML = LINES.slice(0, 3).map((l, i) => makeCard(l, i * 0.1)).join('');
document.getElementById('row2').innerHTML = LINES.slice(3).map((l, i) => makeCard(l, i * 0.1)).join('');

const cards = document.querySelectorAll('.card');
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
}, { threshold: 0.08 });
cards.forEach(c => io.observe(c));

function reportHeight() {
  window.parent.postMessage({ action: 'setHeight', height: document.documentElement.scrollHeight }, '*');
}
window.addEventListener('load', reportHeight);
new ResizeObserver(reportHeight).observe(document.body);
</script>
</body>
</html>
