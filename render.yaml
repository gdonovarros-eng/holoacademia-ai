services:
  - type: static
    name: holoacademia-sections
    staticPublishPath: api/static/sections
    pullRequestPreviewsEnabled: false

  - type: web
    name: holoacademia-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health

    envVars:
      # ── LLM ────────────────────────────────────────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-20b
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_RESPONSE_TIMEOUT_SECONDS
        value: "30"
      - key: OPENAI_REASONING_EFFORT
        value: high

      # ── Cuadro Holos (Motor terapéutico vía OpenRouter) ─────────────────────────
      - key: HOLOS_MODEL
        value: google/gemini-2.5-flash
      - key: HOLOS_MAX_TOKENS
        value: "3500"

      # ── Motores IA ─────────────────────────────────────────────────────────────
      - key: COURSE_ASSISTANT_USE_MODEL
        value: "true"
      - key: ACADEMIC_ASSISTANT_USE_MODEL
        value: "true"
      - key: THERAPEUTIC_ASSISTANT_USE_MODEL
        value: "true"

      # ── Auth / Sesiones (Wix embed) ─────────────────────────────────────────────
      - key: EMBED_SECRET
        sync: false
      - key: LOGIN_URL
        value: https://www.holoacademia.com/miembros
