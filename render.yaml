services:
  - type: static
    name: holoacademia-sections
    staticPublishPath: api/static/sections
    pullRequestPreviewsEnabled: false

  - type: web
    name: holoacademia-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health

    envVars:
      # ── LLM ────────────────────────────────────────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-20b
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_RESPONSE_TIMEOUT_SECONDS
        value: "30"
      - key: OPENAI_REASONING_EFFORT
        value: high

      # ── Cuadro Holos (Motor terapéutico vía OpenRouter) ─────────────────────────
      - key: HOLOS_MODEL
        value: google/gemini-2.5-flash
      - key: HOLOS_MAX_TOKENS
        value: "3500"

      # ── Base de conocimiento (Neon · Postgres + pgvector) ───────────────────────
      # El valor (cadena de conexión con contraseña) se define en el panel de Render,
      # nunca en git. Si falta, la app cae al índice local de respaldo.
      - key: KNOWLEDGE_DB_URL
        sync: false

      # ── Motores IA ─────────────────────────────────────────────────────────────
      - key: COURSE_ASSISTANT_USE_MODEL
        value: "true"
      - key: ACADEMIC_ASSISTANT_USE_MODEL
        value: "true"
      - key: THERAPEUTIC_ASSISTANT_USE_MODEL
        value: "true"

      # ── Auth / Sesiones ─────────────────────────────────────────────────────────
      # EMBED_SECRET: secreto COMPARTIDO con holoacademia.tv (Cloudflare Pages).
      # Debe tener EXACTAMENTE el mismo valor en los dos lados: con él, .tv firma la
      # sesión del terapeuta y el Copiloto la valida.
      # ⚠️ Si se deja vacía, el candado del Copiloto se DESACTIVA por completo
      #    (session_guard deja pasar a cualquiera). No la dejes sin valor.
      - key: EMBED_SECRET
        sync: false
      - key: LOGIN_URL
        value: https://holoacademia.tv/login.html

      # ── Base de datos ───────────────────────────────────────────────────────────
      # Consumo de cuotas del Copiloto. La MISMA Neon que usa el Hub.
      # Sin esto cae a SQLite en el disco de Render, que es efímero: el consumo de
      # todos los usuarios se borra en cada despliegue.
      - key: DATABASE_URL
        sync: false

      # ── Admin (opcional) ────────────────────────────────────────────────────────
      # Sin estas dos, no se crea cuenta de administrador. Antes había una contraseña
      # por defecto escrita en el código de un repo público: dala por comprometida.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
